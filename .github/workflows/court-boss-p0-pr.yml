name: Court Boss P0 PR Validation

on:
  pull_request:
    branches: [court-boss-live]
    paths:
      - "court-boss/**"
      - "supabase/functions/court-boss/**"
      - "supabase/migrations/**"
      - "tests/**"
      - ".github/workflows/court-boss-*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Local regression suite (no production writes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check mobile client syntax
        run: |
          node --check court-boss/app.js
          node --check court-boss/daily-career-v22.js
          node --check court-boss/match-center-v1.js
          node --check court-boss/modules.js
      - name: Run complete regression suite
        run: node --test tests/*.test.mjs
