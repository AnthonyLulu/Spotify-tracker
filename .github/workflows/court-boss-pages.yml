name: Court Boss Smoke Test

on:
  push:
    branches: ["court-boss-live"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: court-boss-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check court-boss/app.js
          node --check court-boss/tactics.js
          node --check court-boss/modules.js

      - name: Check published HTML and assets
        env:
          BASE: https://qrsvliliezbiedmaewml.supabase.co/functions/v1/court-boss-static-publish
        run: |
          curl --fail --silent --show-error "$BASE/" -o /tmp/index.html
          grep -q 'Court Boss' /tmp/index.html
          grep -q 'app.js?v=20260927-6' /tmp/index.html
          grep -q 'tactics.js?v=20260927-6' /tmp/index.html
          grep -q 'modules.js?v=20260927-6' /tmp/index.html
          curl --fail --silent --show-error "$BASE/app.js?v=20260927-6" -o /tmp/app.js
          curl --fail --silent --show-error "$BASE/tactics.js?v=20260927-6" -o /tmp/tactics.js
          curl --fail --silent --show-error "$BASE/modules.js?v=20260927-6" -o /tmp/modules.js
          node --check /tmp/app.js
          node --check /tmp/tactics.js
          node --check /tmp/modules.js

      - name: Check live backend
        env:
          API: https://qrsvliliezbiedmaewml.supabase.co/functions/v1/court-boss
        run: |
          curl --fail --silent --show-error "$API/api/world" -o /tmp/world.json
          curl --fail --silent --show-error "$API/api/rankings?kind=singles&offset=0&limit=5" -o /tmp/rankings.json
          node -e "const w=require('/tmp/world.json'); if(!w.playersTotal) throw new Error('world payload invalid'); console.log('players',w.playersTotal)"
          node -e "const r=require('/tmp/rankings.json'); if(!Array.isArray(r.rows)||r.rows.length!==5) throw new Error('ranking payload invalid'); console.log(r.rows.map(x=>'#'+x.ranking+' '+x.name).join(' | '))"

      - name: Mobile browser smoke test
        env:
          BASE: https://qrsvliliezbiedmaewml.supabase.co/functions/v1/court-boss-static-publish
        run: |
          cd /tmp
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
          cat > mobile-smoke.cjs <<'EOF'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({
              viewport:{width:390,height:844},
              isMobile:true,
              hasTouch:true
            });
            const pageErrors=[];
            page.on('pageerror',e=>pageErrors.push('pageerror: '+e.message));
            page.on('console',m=>{ if(m.type()==='error') pageErrors.push('console: '+m.text()); });
            page.on('requestfailed',r=>pageErrors.push('requestfailed: '+r.url()+' '+(r.failure()?.errorText||'')));
            page.on('response',r=>{ if(r.status()>=400) pageErrors.push('http '+r.status()+': '+r.url()); });
            await page.goto(process.env.BASE+'/',{waitUntil:'networkidle',timeout:60000});
            try{
              await page.getByRole('heading',{name:'Centre de management'}).waitFor({timeout:12000});
            }catch(e){
              console.error('BODY:',(await page.locator('body').innerText()).slice(0,5000));
              console.error('ERRORS:',pageErrors);
              throw e;
            }

            await page.getByRole('button',{name:'Classements'}).click();
            await page.getByRole('heading',{name:'Classements'}).waitFor();
            const firstPlayer=page.locator('tbody tr.click').first();
            await firstPlayer.click();
            await page.getByText('Dossier joueur').waitFor();
            await page.getByRole('button',{name:'Attributs'}).click();
            await page.getByText('Technique').waitFor();
            await page.getByRole('button',{name:'✕'}).click();

            await page.getByRole('button',{name:'Plus'}).click();
            await page.getByRole('heading',{name:'Tous les modules'}).waitFor();
            await page.getByText('Plan de match & coaching').click();
            await page.getByRole('heading',{name:'Tactique'}).waitFor();
            await page.getByRole('button',{name:'Match Center'}).click();
            await page.getByRole('heading',{name:'Match live'}).waitFor();

            if(pageErrors.length) throw new Error('Browser errors: '+pageErrors.join(' | '));
            console.log('mobile browser smoke: OK');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node mobile-smoke.cjs
