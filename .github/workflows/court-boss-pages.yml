name: Court Boss Smoke Test

on:
  push:
    branches: ["court-boss-live"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: court-boss-smoke-v10
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check court-boss/app.js
          node --check court-boss/tactics.js
          node --check court-boss/modules.js
          node --check court-boss/match-center-v1.js
          node --check court-boss/daily-career-v22.js

      - name: Run tournament integrity tests
        run: |
          node --test tests/tournament-integrity.test.mjs
          node --test tests/tournament-entry-rules-v19.test.mjs
          node --test tests/tournament-doubles-entry-rules-v20.test.mjs

      - name: Wait for Render static deploy
        env:
          BASE: https://court-boss-tennis-manager.onrender.com
        run: |
          LOCAL_APP=$(sha256sum court-boss/app.js | awk '{print $1}')
          LOCAL_MODULES=$(sha256sum court-boss/modules.js | awk '{print $1}')
          LOCAL_CSS=$(sha256sum court-boss/app.css | awk '{print $1}')
          LOCAL_DAILY_JS=$(sha256sum court-boss/daily-career-v22.js | awk '{print $1}')
          LOCAL_DAILY_CSS=$(sha256sum court-boss/daily-career-v22.css | awk '{print $1}')
          for i in {1..36}; do
            if curl --fail --silent --show-error "$BASE/app.js?v=20260927-10" -o /tmp/render-app.js \
              && curl --fail --silent --show-error "$BASE/modules.js?v=20260927-10" -o /tmp/render-modules.js \
              && curl --fail --silent --show-error "$BASE/app.css?v=20260927-10" -o /tmp/render-app.css \
              && curl --fail --silent --show-error "$BASE/daily-career-v22.js?v=20261004-daily-v22" -o /tmp/render-daily.js \
              && curl --fail --silent --show-error "$BASE/daily-career-v22.css?v=20261004-daily-v22" -o /tmp/render-daily.css; then
              REMOTE_APP=$(sha256sum /tmp/render-app.js | awk '{print $1}')
              REMOTE_MODULES=$(sha256sum /tmp/render-modules.js | awk '{print $1}')
              REMOTE_CSS=$(sha256sum /tmp/render-app.css | awk '{print $1}')
              REMOTE_DAILY_JS=$(sha256sum /tmp/render-daily.js | awk '{print $1}')
              REMOTE_DAILY_CSS=$(sha256sum /tmp/render-daily.css | awk '{print $1}')
              if [ "$LOCAL_APP" = "$REMOTE_APP" ] \
                && [ "$LOCAL_MODULES" = "$REMOTE_MODULES" ] \
                && [ "$LOCAL_CSS" = "$REMOTE_CSS" ] \
                && [ "$LOCAL_DAILY_JS" = "$REMOTE_DAILY_JS" ] \
                && [ "$LOCAL_DAILY_CSS" = "$REMOTE_DAILY_CSS" ]; then
                echo "Render build matches the checked-out branch"
                exit 0
              fi
            fi
            echo "Waiting for exact Render build ($i/36)"
            sleep 5
          done
          echo "Render did not publish the exact checked-out build in time"
          exit 1

      - name: Check published assets
        env:
          BASE: https://court-boss-tennis-manager.onrender.com
        run: |
          curl --fail --silent --show-error "$BASE/app.js?v=20260927-10" -o /tmp/app.js
          curl --fail --silent --show-error "$BASE/tactics.js?v=20260927-10" -o /tmp/tactics.js
          curl --fail --silent --show-error "$BASE/modules.js?v=20260927-10" -o /tmp/modules.js
          curl --fail --silent --show-error "$BASE/daily-career-v22.js?v=20261004-daily-v22" -o /tmp/daily-career-v22.js
          curl --fail --silent --show-error "$BASE/daily-career-v22.css?v=20261004-daily-v22" -o /tmp/daily-career-v22.css
          curl --fail --silent --show-error "$BASE/play.html" -o /tmp/play.html
          grep -q 'app.js?v=20261004-hof-v30' /tmp/play.html
          node --check /tmp/app.js
          node --check /tmp/tactics.js
          node --check /tmp/modules.js
          node --check /tmp/daily-career-v22.js

      - name: Check live backend
        env:
          API: https://qrsvliliezbiedmaewml.supabase.co/functions/v1/court-boss
        run: |
          curl --fail --silent --show-error "$API/api/world" -o /tmp/world.json
          for kind in singles race doubles nextgen junior; do
            curl --fail --silent --show-error "$API/api/rankings?kind=$kind&offset=0&limit=10" -o "/tmp/$kind.json"
          done
          curl --fail --silent --show-error "$API/api/player?id=14405" -o /tmp/federer.json
          curl --fail --silent --show-error "$API/api/player?id=14406" -o /tmp/nadal.json
          curl --fail --silent --show-error "$API/api/tournament-detail?id=3266" -o /tmp/ao-junior.json
          curl --fail --silent --show-error "$API/api/tournament-detail?id=3269" -o /tmp/uso-junior.json
          curl --fail --silent --show-error "$API/api/tournament-detail?id=2078" -o /tmp/united-cup.json
          curl --fail --silent --show-error "$API/api/tournament-detail?id=2040" -o /tmp/laver-cup.json
          curl --fail --silent --show-error "$API/api/tournament-detail?id=3396" -o /tmp/junior-davis.json
          node -e "const w=require('/tmp/world.json'); if(!w.playersTotal) throw new Error('world payload invalid'); console.log('players',w.playersTotal)"
          node <<'EOF'
          const fs=require('fs');
          for(const kind of ['singles','race','doubles','nextgen','junior']){
            const r=JSON.parse(fs.readFileSync('/tmp/'+kind+'.json','utf8'));
            if(!Array.isArray(r.rows)||!r.rows.length)throw new Error(kind+' ranking empty');
            console.log(kind,r.rows.slice(0,3).map(x=>x.name).join(' | '));
          }
          const ng=JSON.parse(fs.readFileSync('/tmp/nextgen.json','utf8'));
          if(ng.rows[0]?.name!=='Jakub Mensik'||ng.rows[0]?.nextgen_ranking!==1)throw new Error('Next Gen #1 invalid');
          if(ng.rows.some(x=>x.birth_date<'2005-01-01'))throw new Error('ineligible Next Gen player');
          const db=JSON.parse(fs.readFileSync('/tmp/doubles.json','utf8'));
          if(db.rows[0]?.name!=='Lloyd Glasspool')throw new Error('Doubles #1 invalid');
          const fed=JSON.parse(fs.readFileSync('/tmp/federer.json','utf8'));
          const nadal=JSON.parse(fs.readFileSync('/tmp/nadal.json','utf8'));
          const aoj=JSON.parse(fs.readFileSync('/tmp/ao-junior.json','utf8'));
          const usoj=JSON.parse(fs.readFileSync('/tmp/uso-junior.json','utf8'));
          const united=JSON.parse(fs.readFileSync('/tmp/united-cup.json','utf8'));
          const laver=JSON.parse(fs.readFileSync('/tmp/laver-cup.json','utf8'));
          const juniorDavis=JSON.parse(fs.readFileSync('/tmp/junior-davis.json','utf8'));
          if(aoj.tournament?.singles_draw_size!==64||aoj.tournament?.qualifying_draw_size!==32||aoj.tournament?.doubles_draw_size!==32)throw new Error('AO Junior draw sizes invalid');
          if(aoj.tournament?.main_draw_start_date!=='2026-01-24'||aoj.tournament?.qualifying_start_date!=='2026-01-21')throw new Error('AO Junior dates invalid');
          if(aoj.format_rule?.qualifier_count!==8||aoj.main?.length!==64||aoj.qualifying?.length!==32)throw new Error('AO Junior field composition invalid');
          if(usoj.tournament?.main_draw_start_date!=='2026-09-06'||usoj.tournament?.qualifying_start_date!=='2026-09-03'||usoj.tournament?.doubles_draw_size!==32)throw new Error('USO Junior dates/doubles invalid');
          for(const [label,payload,code,teams] of [
            ['United Cup',united,'united_cup',18],
            ['Laver Cup',laver,'laver_cup',2],
            ['Junior Davis',juniorDavis,'junior_davis',16]
          ]){
            if(payload.special_team_event?.code!==code||payload.special_team_event?.teams!==teams)throw new Error(label+' team format invalid');
            if((payload.main||[]).length||(payload.qualifying||[]).length)throw new Error(label+' leaked into individual draw');
            if(payload.entry_preview_model!=='team_selection_v2_captains')throw new Error(label+' entry mode invalid: '+payload.entry_preview_model);
          }
          if(fed.player?.career_status!=='retired'||fed.tournamentHistory?.length<300)throw new Error('Federer history invalid');
          if(nadal.player?.career_status!=='retired'||nadal.tournamentHistory?.length<300)throw new Error('Nadal history invalid');
          if(fed.tournamentHistory.filter(x=>x.is_grand_slam&&x.result_code==='W').length!==20)throw new Error('Federer slam count invalid');
          if(nadal.tournamentHistory.filter(x=>x.is_grand_slam&&x.result_code==='W').length!==22)throw new Error('Nadal slam count invalid');
          const legacy=[...fed.tournamentHistory,...nadal.tournamentHistory].filter(x=>['R16','R32','R64','R128'].includes(x.result_code));
          if(legacy.length)throw new Error('legacy round codes found: '+legacy.map(x=>x.result_code).join(','));
          const nadalAo2005=nadal.tournamentHistory.find(x=>x.season===2005&&/Australian Open/i.test(x.tournament_name));
          if(nadalAo2005?.result_code!=='R4')throw new Error('Nadal AO 2005 must be R4, got '+nadalAo2005?.result_code);
          for(const [label,data] of [['Federer',fed],['Nadal',nadal]]){
            const keys=new Set();
            for(const h of data.tournamentHistory){
              const k=[h.season,h.tournament_id].join('|');
              if(keys.has(k))throw new Error(label+' duplicate tournament history '+k);
              keys.add(k);
            }
          }
          EOF

      - name: Mobile browser smoke test
        env:
          BASE: https://court-boss-tennis-manager.onrender.com
        run: |
          cd /tmp
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
          cat > mobile-smoke.cjs <<'EOF'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({
              viewport:{width:390,height:844},
              isMobile:true,
              hasTouch:true
            });
            const pageErrors=[];
            page.on('pageerror',e=>pageErrors.push('pageerror: '+e.message));
            page.on('console',m=>{ if(m.type()==='error') pageErrors.push('console: '+m.text()); });
            page.on('requestfailed',r=>pageErrors.push('requestfailed: '+r.url()+' '+(r.failure()?.errorText||'')));
            page.on('response',r=>{ if(r.status()>=400) pageErrors.push('http '+r.status()+': '+r.url()); });
            page.on('dialog',async d=>{ pageErrors.push('dialog: '+d.message()); await d.dismiss(); });

            await page.goto(process.env.BASE+'/',{waitUntil:'domcontentloaded',timeout:60000});
            try{
              await page.getByRole('heading',{name:'Centre de management'}).waitFor({timeout:20000});
            }catch(e){
              console.error('BODY:',(await page.locator('body').innerText()).slice(0,5000));
              console.error('ERRORS:',pageErrors);
              throw e;
            }
            await page.getByRole('button',{name:'Continuer ›'}).waitFor();
            await page.evaluate(()=>nav('training'));
            await page.getByRole('heading',{name:'Entraînement jour par jour'}).waitFor();
            await page.getByRole('heading',{name:'Matin / après-midi'}).waitFor();
            await page.getByText('2 blocs max / jour').waitFor();
            if(await page.locator('.daily-training-day').count()!==7)throw new Error('daily training must render exactly 7 days');
            if(await page.locator('.daily-training-day select').count()<21)throw new Error('daily training needs morning, afternoon and intensity controls');

            await page.getByRole('button',{name:'Classements'}).click();
            await page.getByRole('heading',{name:'Classements'}).waitFor();

            await page.getByRole('button',{name:'ATP Race'}).click();
            await page.getByText('Carlos Alcaraz').first().waitFor();

            await page.getByRole('button',{name:'ATP Doubles'}).click();
            await page.getByText('Lloyd Glasspool').first().waitFor();

            await page.getByRole('button',{name:'Next Gen U21'}).click();
            await page.getByText('Jakub Mensik').first().waitFor();
            await page.getByText('Qualifié').first().waitFor();
            await page.getByRole('button',{name:'U20'}).click();
            await page.getByText('Joao Fonseca').first().waitFor();
            await page.getByRole('button',{name:'U21',exact:true}).click();
            await page.getByText('Jakub Mensik').first().waitFor();

            await page.getByRole('button',{name:'ITF Juniors'}).click();
            const firstPlayer=page.locator('tbody tr.click').first();
            await firstPlayer.waitFor();
            await firstPlayer.click();
            await page.getByText('Dossier joueur').waitFor();
            await page.getByRole('button',{name:'Attributs'}).click();
            await page.locator('.attr-sections').waitFor();
            if(await page.locator('.attr-row').count()<10)throw new Error('player attributes tab did not render');
            await page.getByRole('button',{name:'✕'}).click();

            await page.evaluate(()=>openPlayer(1));
            await page.getByText('Dossier joueur').waitFor();
            await page.getByRole('button',{name:'Records & Awards'}).click();
            await page.getByRole('heading',{name:'Carrière en cours'}).waitFor();
            await page.getByText('Hall of Fame',{exact:true}).first().waitFor();
            await page.getByText('Jannik Sinner dans l’histoire').waitFor();
            await page.getByRole('button',{name:'✕'}).click();

            await page.evaluate(()=>nav('history'));
            await page.getByRole('heading',{name:'Histoire, records & nations'}).waitFor();
            await page.getByText('Hall of Fame dynamique',{exact:true}).waitFor();
            await page.getByText('Les futures classes se construiront avec la carrière').waitFor();

            await page.evaluate(()=>openPlayer(3));
            await page.getByText('Dossier joueur').waitFor();
            await page.getByRole('button',{name:'Palmarès'}).click();
            await page.getByRole('heading',{name:'Grands Chelems année par année'}).waitFor();
            await page.getByLabel(/Wimbledon 2025/).click();
            await page.getByText('Finaliste').waitFor();
            await page.locator('#overlay').getByText('Jannik Sinner',{exact:true}).first().waitFor();
            await page.getByRole('button',{name:'✕'}).click();

            await page.evaluate(()=>openPlayer(14405));
            await page.getByText('Dossier joueur · Légende').waitFor();
            await page.getByText('Retraité').first().waitFor();
            await page.getByRole('button',{name:'Palmarès'}).click();
            await page.getByRole('heading',{name:'Grands Chelems année par année'}).waitFor();
            await page.getByLabel(/Wimbledon 2009/).click();
            await page.getByText('Vainqueur').waitFor();
            await page.locator('#overlay').getByText('Andy Roddick',{exact:true}).first().waitFor();
            await page.getByText(/16-14/).waitFor();
            await page.getByRole('button',{name:'✕'}).click();

            await page.getByRole('button',{name:'Plus'}).click();
            await page.getByRole('heading',{name:'Tous les modules'}).waitFor();
            await page.getByText('Plan de match & coaching').click();
            await page.getByRole('heading',{name:'Tactique'}).waitFor();
            await page.getByRole('button',{name:'Match Center'}).click();
            await page.getByRole('heading',{name:'Match Center'}).waitFor();

            await page.route('**/api/save-slot',route=>route.fulfill({
              status:200,contentType:'application/json',
              body:JSON.stringify({ok:true,slot:{slot_no:0,slot_name:'CI pre-match',career_date:'2025-12-01',week:1,updated_at:'2025-12-01T00:00:00Z'}})
            }));
            await page.route('**/api/save-slots',route=>route.fulfill({
              status:200,contentType:'application/json',
              body:JSON.stringify({slots:[]})
            }));
            await page.route('**/api/save',route=>route.fulfill({
              status:200,contentType:'application/json',
              body:JSON.stringify({ok:true})
            }));
            await page.route('**/api/live-match/start',route=>route.fulfill({
              status:200,contentType:'application/json',
              body:JSON.stringify({
                session:{id:999999,status:'active',surface:'Dur',user_sets:0,opponent_sets:0,set_no:1,user_games:0,opponent_games:0,user_points:0,opponent_points:0,serving_user:true,momentum:50,stats:{},score_log:[],last_point:{}},
                opponent:{id:2,name:'Test Opponent',country:'FRA',ranking:740},
                win_probability:50
              })
            }));
            await page.route('**/api/live-match/point**',route=>route.fulfill({
              status:200,contentType:'application/json',
              body:JSON.stringify({
                session:{id:999999,status:'active',surface:'Dur',user_sets:0,opponent_sets:0,set_no:1,user_games:0,opponent_games:0,user_points:1,opponent_points:0,serving_user:true,momentum:51,stats:{user_winners:1},score_log:[],last_point:{winner:'user',rally:6,shot:'winner',user_x:62,opp_x:31,ball_x:28,ball_y:24}},
                opponent:{id:2,name:'Test Opponent',country:'FRA',ranking:740},
                win_probability:54,last_point:{winner:'user',rally:6,shot:'winner',user_x:62,opp_x:31,ball_x:28,ball_y:24}
              })
            }));
            const play=page.getByRole('button',{name:/Jouer en live/});
            await play.click();
            await page.locator('.cb-court').waitFor();
            if(await page.locator('.fm-player-dot').count()!==2)throw new Error('match viewer needs two player circles');
            if(await page.locator('.fm-ball').count()!==1)throw new Error('match viewer needs one ball');
            const liveToggle=page.locator('.cb-speed-row button').first();
            await liveToggle.waitFor();
            if(/Pause/.test(await liveToggle.innerText()))await liveToggle.click();
            await page.evaluate(async()=>{ await window.playLivePoint(); });
            await page.waitForFunction(()=>Number(local.liveMatch?.last_point?.rally||0)===6,null,{timeout:10000});
            await page.locator('.cb-rally').filter({hasText:'6 coups'}).waitFor({timeout:10000});

            if(pageErrors.length) throw new Error('Browser errors: '+pageErrors.join(' | '));
            console.log('mobile browser smoke: OK');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node mobile-smoke.cjs
