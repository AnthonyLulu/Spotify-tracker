name: Deploy Court Boss

on:
  push:
    branches: ["court-boss-live"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: court-boss-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Court Boss
        uses: actions/upload-pages-artifact@v3
        with:
          path: court-boss
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
