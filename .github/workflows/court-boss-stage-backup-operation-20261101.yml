# One explicitly requested backup attempt on its own operations branch.
# Fixed audited source; the normal game branch and production service are not updated.
name: Court Boss isolated-stage backup operation 2026-11-01
on:
  push:
    branches: [ops/court-boss-stage-backup-20261101]

permissions:
  contents: read

concurrency:
  group: cb-isolated-stage-external-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.repository == 'AnthonyLulu/Spotify-tracker' && github.ref == 'refs/heads/ops/court-boss-stage-backup-20261101'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout audited game branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: d4c7cf4e8364dc072c5957f5b59efb02d8474570

      - name: Prepare isolated stage connection and require owner public key
        shell: bash
        env:
          CB_E2E_DB_URL: ${{ secrets.CB_E2E_DB_URL }}
          CB_E2E_DB_PASSWORD: ${{ secrets.CB_E2E_DB_PASSWORD }}
          CB_BACKUP_AGE_RECIPIENT: ${{ secrets.CB_BACKUP_AGE_RECIPIENT }}
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const fail = message => { console.error(message); process.exit(2); };
          const rawUrl = process.env.CB_E2E_DB_URL;
          const password = process.env.CB_E2E_DB_PASSWORD;
          if (!rawUrl && !password) fail('Missing isolated CB_E2E_DB_PASSWORD or CB_E2E_DB_URL secret');
          let u;
          try {
            // The owner can paste the password alone; URI escaping is automatic.
            u = new URL(rawUrl || 'postgresql://postgres.sozrygjxjotozrsenred:' +
              encodeURIComponent(password) + '@aws-1-eu-west-3.pooler.supabase.com:5432/postgres');
          } catch {
            fail('Invalid isolated stage connection');
          }
          if (!/^postgres(ql)?:$/.test(u.protocol) || !u.password || u.pathname !== '/postgres')
            fail('Invalid isolated stage connection');
          const stageDirect = u.hostname === 'db.sozrygjxjotozrsenred.supabase.co' && u.username === 'postgres';
          const stagePooler = u.hostname === 'aws-1-eu-west-3.pooler.supabase.com' &&
            u.username === 'postgres.sozrygjxjotozrsenred' && u.port === '5432';
          if (!stageDirect && !stagePooler) fail('Refusing any source other than isolated stage');
          const recipient = (process.env.CB_BACKUP_AGE_RECIPIENT || '').trim();
          if (!/^age1[023456789acdefghjklmnpqrstuvwxyz]{58}$/.test(recipient))
            fail('Missing or invalid owner age public recipient');
          u.searchParams.set('sslmode', 'require');
          const connection = u.href;
          // Mask the derived URL too: its encoded password differs from the raw secret.
          console.log('::add-mask::' + connection);
          fs.appendFileSync(process.env.GITHUB_ENV,
            'CB_E2E_DB_URL=' + connection + '\nCB_BACKUP_AGE_RECIPIENT=' + recipient + '\n');
          console.log('Isolated stage connection configured; owner public key present.');
          NODE

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2

      - name: Install local PostgreSQL client and age
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client age

      - name: Start ephemeral local Supabase database with PostgreSQL 17
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/cb-restore-local"
          cd "$RUNNER_TEMP/cb-restore-local"
          supabase init
          sed -i 's/^major_version = "15"/major_version = "17"/' supabase/config.toml
          grep -F 'major_version = "17"' supabase/config.toml
          supabase db start
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -X -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE cb_e2e_restore_ci TEMPLATE postgres'

      - name: Make encrypted backup, verify restored full critical state
        shell: bash
        env:
          CB_E2E_RESTORE_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/cb_e2e_restore_ci
          CB_E2E_BACKUP_DIR: ${{ runner.temp }}/cb-encrypted-archives
        run: |
          set -Eeuo pipefail
          bash scripts/cb-stage-independent-backup-verify.sh
          find "$CB_E2E_BACKUP_DIR" -maxdepth 1 -name '*.tar.age' -size +0c | grep -q .
          find "$CB_E2E_BACKUP_DIR" -maxdepth 1 -name '*.sha256' | grep -q .

      - name: Upload encrypted backup only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: court-boss-isolated-stage-encrypted-backup
          path: |
            ${{ runner.temp }}/cb-encrypted-archives/*.tar.age
            ${{ runner.temp }}/cb-encrypted-archives/*.tar.age.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
