name: Court Boss E2E isolated-stage encrypted backup (manual only)
on:
  workflow_dispatch:
    inputs:
      stage_pooler_host:
        description: 'Exact session pooler HOST from Supabase Connect (not a password or URL)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cb-isolated-stage-external-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.ref == 'refs/heads/court-boss-live'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout audited game branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fail closed if isolated stage connection or owner public key is absent
        shell: bash
        env:
          CB_E2E_DB_URL: ${{ secrets.CB_E2E_DB_URL }}
          CB_E2E_DB_PASSWORD: ${{ secrets.CB_E2E_DB_PASSWORD }}
          CB_E2E_POOLER_HOST: ${{ inputs.stage_pooler_host }}
          CB_BACKUP_AGE_RECIPIENT: ${{ secrets.CB_BACKUP_AGE_RECIPIENT }}
        run: |
          set -Eeuo pipefail
          [[ "$CB_BACKUP_AGE_RECIPIENT" == age1* ]] || { echo 'Missing or invalid owner age public recipient'; exit 2; }
          node <<'NODE'
          const stage = 'sozrygjxjotozrsenred';
          const safeHost = h => /^aws-[0-9]+-[a-z0-9-]+\.pooler\.supabase\.com$/.test(h);
          const suppliedUrl = process.env.CB_E2E_DB_URL;
          if (suppliedUrl) {
            const u = new URL(suppliedUrl);
            if (!/^postgres(ql)?:$/.test(u.protocol) ||
                !safeHost(u.hostname) ||
                u.username !== 'postgres.' + stage ||
                u.port !== '5432' || u.pathname !== '/postgres' || !u.password) {
              console.error('CB_E2E_DB_URL must be the STAGE Session pooler URL (port 5432), not the IPv6 direct URL');
              process.exit(2);
            }
          } else {
            if (!process.env.CB_E2E_DB_PASSWORD || !safeHost(process.env.CB_E2E_POOLER_HOST || '')) {
              console.error('Select the exact STAGE Session pooler host in Run workflow and keep CB_E2E_DB_PASSWORD secret configured');
              process.exit(2);
            }
          }
          NODE

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2

      - name: Install local PostgreSQL client and age
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client age

      - name: Start ephemeral local Supabase database with PostgreSQL 17
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/cb-restore-local"
          cd "$RUNNER_TEMP/cb-restore-local"
          supabase init
          python3 "$GITHUB_WORKSPACE/scripts/cb-configure-local-pg17.py" supabase/config.toml
          supabase db start
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -X -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE cb_e2e_restore_ci TEMPLATE template0'

      - name: Make encrypted backup, verify restored full critical state
        shell: bash
        env:
          CB_E2E_DB_URL: ${{ secrets.CB_E2E_DB_URL }}
          CB_E2E_DB_PASSWORD: ${{ secrets.CB_E2E_DB_PASSWORD }}
          CB_E2E_POOLER_HOST: ${{ inputs.stage_pooler_host }}
          CB_BACKUP_AGE_RECIPIENT: ${{ secrets.CB_BACKUP_AGE_RECIPIENT }}
          CB_E2E_RESTORE_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/cb_e2e_restore_ci
          CB_E2E_BACKUP_DIR: ${{ runner.temp }}/cb-encrypted-archives
        run: |
          set -Eeuo pipefail
          bash scripts/cb-stage-independent-backup-verify.sh
          find "$CB_E2E_BACKUP_DIR" -maxdepth 1 -name '*.tar.age' -size +0c | grep -q .
          find "$CB_E2E_BACKUP_DIR" -maxdepth 1 -name '*.sha256' | grep -q .

      - name: Upload encrypted backup only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: court-boss-isolated-stage-encrypted-backup
          path: |
            ${{ runner.temp }}/cb-encrypted-archives/*.tar.age
            ${{ runner.temp }}/cb-encrypted-archives/*.tar.age.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
