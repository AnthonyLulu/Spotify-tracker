name: Court Boss Visual Assets

on:
  push:
    branches: ["court-boss-live"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: court-boss-visual-assets-${{ github.sha }}
  cancel-in-progress: false

jobs:
  visual-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for exact Render app
        env:
          BASE: https://court-boss-tennis-manager.onrender.com
        run: |
          LOCAL_APP=$(sha256sum court-boss/app.js | awk '{print $1}')
          LOCAL_RECORDS=$(sha256sum court-boss/records-v1.js | awk '{print $1}')
          for i in {1..60}; do
            if curl --fail --silent --show-error "$BASE/app.js?v=visual-assets" -o /tmp/render-app.js \
              && curl --fail --silent --show-error "$BASE/records-v1.js?v=20261004-records-v11" -o /tmp/render-records.js; then
              REMOTE_APP=$(sha256sum /tmp/render-app.js | awk '{print $1}')
              REMOTE_RECORDS=$(sha256sum /tmp/render-records.js | awk '{print $1}')
              if [ "$LOCAL_APP" = "$REMOTE_APP" ] && [ "$LOCAL_RECORDS" = "$REMOTE_RECORDS" ]; then
                curl --fail --silent --show-error "$BASE/" -o /tmp/index.html
                grep -Fq 'records-v1.js?v=' /tmp/index.html
                echo "Exact visual build ready"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Render did not publish this visual build"
          exit 1

      - name: Verify records photo and tournament logo on mobile
        env:
          BASE: https://court-boss-tennis-manager.onrender.com
        run: |
          cd /tmp
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
          cat > visual-assets.cjs <<'EOF'
          const { chromium } = require('playwright');

          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({
              viewport:{width:390,height:844},
              isMobile:true,
              hasTouch:true
            });

            page.on('dialog',async d=>{ await d.dismiss(); });

            await page.route('**/api/countries',route=>route.fulfill({
              status:200,
              contentType:'application/json',
              body:JSON.stringify({rows:[]})
            }));

            await page.goto(process.env.BASE+'/',{
              waitUntil:'domcontentloaded',
              timeout:60000
            });
            await page.getByRole('heading',{name:'Centre de management'}).waitFor({timeout:25000});
            const clearAccessGate=async()=>page.evaluate(()=>{
              document.querySelectorAll('.cb-access-gate').forEach(g=>{
                try{ if(g.open)g.close(); }catch{}
                g.remove();
              });
            });
            await clearAccessGate();

            // Player photo must survive the tab switch to Records & Awards.
            await page.evaluate(()=>openPlayer(1));
            await page.getByText('Dossier joueur').waitFor();
            await clearAccessGate();
            await page.getByRole('button',{name:'Records & Awards'}).click();
            await page.getByText('Jannik Sinner dans l’histoire').waitFor();
            await page.getByText('Hall of Fame',{exact:true}).first().waitFor();
            await page.waitForFunction(()=>{
              const img=document.querySelector('#overlay img[alt="Jannik Sinner"]');
              return !!img && img.complete && img.naturalWidth>0;
            },null,{timeout:20000});
            await page.getByRole('button',{name:'✕'}).click();

            // Check what the mobile calendar REALLY renders. Tour card logos
            // are .tm-tour-card-logo img, while .tm-tour-logo may live inside
            // an invisible fallback that browsers do not lazy-load.
            await page.evaluate(()=>nav('calendar'));
            await page.getByRole('heading',{name:'Calendrier mondial'}).waitFor({timeout:25000});
            const brisbane=await page.evaluate(async()=>{
              // Use the same exported HTML renderer as the game's actual cards.
              // Internal metadata helpers are not a stable public API.
              const markup=window.tournamentLogoHtml({name:'Brisbane International'});
              const scratch=document.createElement('div');
              scratch.innerHTML=markup;
              const mapped=scratch.querySelector('img.tm-tour-logo');
              if(!mapped?.src)return {ok:false,reason:'renderer returned no image',markup:markup.slice(0,250)};
              const loaded=await Promise.race([
                new Promise(resolve=>{
                  const img=new Image();
                  img.onload=()=>resolve(img.naturalWidth>0);
                  img.onerror=()=>resolve(false);
                  img.src=mapped.src;
                }),
                new Promise(resolve=>setTimeout(()=>resolve(false),20000))
              ]);
              return {ok:loaded,url:mapped.src,reason:loaded?'decoded':'decode failed'};
            });
            if(!brisbane.ok)throw new Error('Brisbane tournament logo cannot decode: '+JSON.stringify(brisbane));
            await page.waitForFunction(()=>{
              const photos=[...document.querySelectorAll('.tm-tour-card-photo-media')];
              return photos.length>0;
            },null,{timeout:25000});

            // Record Hub must exist on the root build the user opens.
            await page.evaluate(()=>nav('history'));
            await page.getByRole('heading',{name:'Histoire, records & nations'}).waitFor({timeout:25000});
            await page.getByText('Record Hub · historique + sauvegarde',{exact:true}).waitFor();
            await page.getByRole('heading',{name:'Exploits, séries et records cultes'}).waitFor();

            console.log('Court Boss visual assets: OK');
            await browser.close();
          })().catch(e=>{
            console.error(e);
            process.exit(1);
          });
          EOF
          node visual-assets.cjs
