name: Debug ATP Historical API

on:
  workflow_dispatch:
  push:
    branches: ["court-boss-live"]
    paths: [".github/workflows/debug-ranking-api.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe weeks endpoint
        run: |
          set +e
          echo "=== /api/weeks ==="
          curl -L --max-time 30 -sS -D /tmp/h1 https://atp-rankings.ishanjha.com/api/weeks -o /tmp/weeks
          cat /tmp/h1
          echo "--- body head ---"
          head -c 6000 /tmp/weeks
          echo
          echo "=== docs root ==="
          curl -L --max-time 30 -sS -D /tmp/h2 https://atp-rankings.ishanjha.com/api-docs -o /tmp/docs
          cat /tmp/h2
          echo "--- docs head ---"
          head -c 3000 /tmp/docs
          echo
