name: Debug ATP Historical API

on:
  workflow_dispatch:
  push:
    branches: ["court-boss-live"]
    paths: [".github/workflows/debug-ranking-api.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe exact week
        run: |
          set -e
          for url in             "https://atp-rankings.ishanjha.com/api/week/2025-12-01"             "https://atp-rankings.ishanjha.com/api/week/2025-12-01?limit=2100"             "https://atp-rankings.ishanjha.com/api/week/2025-12-01?page=1&page_size=2100"; do
            echo "=== $url ==="
            code=$(curl -L --max-time 45 -sS -w "%{http_code}" -o /tmp/out "$url")
            echo "HTTP $code bytes $(wc -c </tmp/out)"
            head -c 5000 /tmp/out
            echo
          done
