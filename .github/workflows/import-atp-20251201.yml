name: Import ATP 2025-12-01
# deep snapshot v2

on:
  workflow_dispatch:
  push:
    branches: ["court-boss-live"]
    paths: [".github/workflows/import-atp-20251201.yml"]

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Import canonical ATP snapshot
        run: |
          set +e
          code=$(curl --silent --show-error --max-time 300             -w "%{http_code}"             https://qrsvliliezbiedmaewml.supabase.co/functions/v1/court-boss-atp-20251201-import             -o /tmp/result.json)
          curl_status=$?
          set -e
          echo "curl_status=$curl_status HTTP=$code"
          cat /tmp/result.json || true
          echo
          if [ "$curl_status" -ne 0 ]; then exit "$curl_status"; fi
          if [ "$code" -ge 400 ]; then exit 1; fi
          node - <<'EOF'
          const r=require('/tmp/result.json');
          if(!r.ok) throw new Error('import failed: '+JSON.stringify(r));
          if(!r.source_count || r.source_count < 1800) throw new Error('incomplete source: '+JSON.stringify(r));
          if(!r.active_count || r.active_count < 1800) throw new Error('incomplete active ranking: '+JSON.stringify(r));
          console.log('canonical import OK',r);
          EOF
