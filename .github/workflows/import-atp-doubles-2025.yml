name: Import ATP Doubles 2025-12-01

on:
  workflow_dispatch:
  push:
    branches: ["court-boss-live"]
    paths: [".github/workflows/import-atp-doubles-2025.yml"]

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scrape ATP doubles historical ranking
        run: |
          python -m pip install --quiet cloudscraper beautifulsoup4
          mkdir -p court-boss/data
          python <<'PY'
          import json,re,cloudscraper
          from bs4 import BeautifulSoup
          from pathlib import Path

          date='2025-12-01'
          url=f'https://www.atptour.com/en/rankings/doubles?RankRange=1-2000&Region=all&DateWeek={date}'
          s=cloudscraper.create_scraper(browser={'browser':'chrome','platform':'windows','mobile':False})
          r=s.get(url,timeout=45)
          soup=BeautifulSoup(r.text,'html.parser')
          out=[]
          for tr in soup.select('table tr'):
              tds=tr.find_all('td')
              if len(tds)<3: continue
              rank_cell=tr.select_one('td.rank') or tds[0]
              rank_txt=re.sub(r'[^0-9]','',rank_cell.get_text(' ',strip=True))
              a=tr.find('a',href=lambda h:h and '/players/' in h)
              if not rank_txt or not a: continue
              href=a.get('href','')
              parts=href.strip('/').split('/')
              source_id=parts[3] if len(parts)>3 else ''
              slug=parts[2] if len(parts)>2 else ''
              name=a.get_text(' ',strip=True)
              if not name and slug: name=slug.replace('-',' ').title()

              pts=None
              points_cell=tr.select_one('td.points')
              candidates=[points_cell] if points_cell else []
              candidates += tds[2:6]
              for cell in candidates:
                  if not cell: continue
                  txt=cell.get_text(' ',strip=True).replace(',','')
                  m=re.fullmatch(r'\d+',re.sub(r'\s+','',txt))
                  if m:
                      val=int(m.group())
                      if val>=0:
                          pts=val
                          break

              out.append({
                  'rank':int(rank_txt),
                  'name':name,
                  'points':pts,
                  'source_id':source_id,
                  'profile':href,
              })

          # Deduplicate exact player/rank artifacts while preserving tied ranks.
          seen=set(); rows=[]
          for x in out:
              k=(x['source_id'] or x['name'].lower(),x['rank'])
              if k in seen: continue
              seen.add(k); rows.append(x)
          rows.sort(key=lambda x:(x['rank'],x['name']))

          diagnostic={
              'url':url,'status':r.status_code,'title':soup.title.get_text(' ',strip=True) if soup.title else '',
              'html_bytes':len(r.content),'table_count':len(soup.find_all('table')),
              'parsed_rows':len(rows),'sample':rows[:20],
              'body_sample':soup.get_text(' ',strip=True)[:1500],
          }
          Path('court-boss/data/atp-doubles-2025-12-01-diagnostic.json').write_text(json.dumps(diagnostic,ensure_ascii=False,indent=2))
          Path('court-boss/data/atp-doubles-2025-12-01.json').write_text(json.dumps({
              'snapshot':date,
              'source':'ATP Tour official historical doubles ranking',
              'url':url,
              'count':len(rows),
              'rows':rows,
          },ensure_ascii=False,indent=2))
          print(json.dumps(diagnostic,ensure_ascii=False,indent=2))
          PY

      - name: Commit doubles snapshot
        run: |
          git config user.name "Court Boss Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add court-boss/data/atp-doubles-2025-12-01*.json
          git diff --cached --quiet || git commit -m "Capture ATP doubles snapshot 2025-12-01"
          git push
