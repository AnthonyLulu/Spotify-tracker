name: Validate ATP Doubles 2025 Snapshot

on:
  workflow_dispatch:
  push:
    branches: ["court-boss-live"]
    paths:
      - ".github/workflows/import-atp-doubles-2025.yml"
      - "court-boss/data/atp-doubles-2025-12-01.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate verified doubles snapshot
        run: |
          node <<'EOF'
          const fs=require('fs');
          const p='court-boss/data/atp-doubles-2025-12-01.json';
          const x=JSON.parse(fs.readFileSync(p,'utf8'));
          if(x.snapshot!=='2025-12-01') throw new Error('wrong snapshot date');
          if(!Array.isArray(x.rows)||x.rows.length!==100) throw new Error('expected 100 verified doubles players');
          const top=x.rows.slice(0,10);
          const expected=['Lloyd Glasspool','Julian Cash','Harri Heliovaara','Henry Patten'];
          for(const n of expected) if(!top.some(r=>r.name===n)) throw new Error('missing '+n);
          if(top[0].rank!==1||top[0].name!=='Lloyd Glasspool') throw new Error('invalid doubles #1');
          const tied3=x.rows.filter(r=>r.rank===3).map(r=>r.name).sort();
          if(tied3.join('|')!==['Harri Heliovaara','Henry Patten'].sort().join('|')) throw new Error('rank #3 tie invalid');
          console.log('verified doubles snapshot OK:',x.rows.length,'players');
          EOF
