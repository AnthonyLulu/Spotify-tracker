name: Import 2025 ATP Race Dataset

on:
  workflow_dispatch:
  push:
    branches: ["court-boss-live"]
    paths: [".github/workflows/import-race-2025.yml"]

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Download Race RData from Tennis-Data
        run: |
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/Thibaud-Meynier/Tennis-Data/main/Scrapping%20tennis%20data/Rank/Race/V_RACE_RANK_2025.RData" \
            -o /tmp/V_RACE_RANK_2025.RData
          ls -lh /tmp/V_RACE_RANK_2025.RData

      - name: Convert Race RData to CSV
        run: |
          mkdir -p court-boss/data
          Rscript - <<'RS'
          e <- new.env()
          loaded <- load("/tmp/V_RACE_RANK_2025.RData", envir=e)
          cat("objects:", paste(loaded, collapse=", "), "\n")
          for (nm in loaded) {
            x <- e[[nm]]
            cat(nm, class(x), nrow(x), ncol(x), "\n")
            if (is.data.frame(x)) {
              write.csv(x, "court-boss/data/atp-race-2025-all-weeks.csv", row.names=FALSE, na="")
              cat("columns:", paste(names(x), collapse=", "), "\n")
              print(tail(x, 20))
              break
            }
          }
          RS

      - name: Commit converted Race dataset
        run: |
          git config user.name "Court Boss Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add court-boss/data/atp-race-2025-all-weeks.csv
          git diff --cached --quiet || git commit -m "Import 2025 ATP Race dataset"
          git push
