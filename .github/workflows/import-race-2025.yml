name: Build ATP Race 2025 Snapshot

on:
  workflow_dispatch:
  push:
    branches: ["court-boss-live"]
    paths: [".github/workflows/import-race-2025.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Download Race RData
        run: |
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/Thibaud-Meynier/Tennis-Data/main/Scrapping%20tennis%20data/Rank/Race/V_RACE_RANK_2025.RData" \
            -o /tmp/V_RACE_RANK_2025.RData

      - name: Build week 49 Race JSON
        run: |
          mkdir -p /tmp/race-out
          Rscript - <<'RS'
          e <- new.env()
          load("/tmp/V_RACE_RANK_2025.RData", envir=e)
          x <- e[["V_RACE_RANK_F"]]
          stopifnot(is.data.frame(x))

          current <- x[x$Season == 2025 & x$Week == 49,
                       c("Player_ID","Cum_Race_points","Rank")]
          previous <- x[x$Season == 2025 & x$Week == 48,
                        c("Player_ID","Rank")]

          names(current) <- c("name","points","rank")
          names(previous) <- c("name","previous_rank")

          current <- current[!is.na(current$name) & !is.na(current$rank), ]
          current <- current[order(current$rank, -current$points, current$name), ]
          current <- current[!duplicated(current$name), ]

          previous <- previous[!is.na(previous$name) & !is.na(previous$previous_rank), ]
          previous <- previous[order(previous$previous_rank, previous$name), ]
          previous <- previous[!duplicated(previous$name), ]

          out <- merge(current, previous, by="name", all.x=TRUE, sort=FALSE)
          out$rank_change <- ifelse(is.na(out$previous_rank), NA,
                                   out$previous_rank - out$rank)
          out <- out[order(out$rank, out$name), ]

          esc <- function(s) {
            s <- gsub("\\", "\\\\", s, fixed=TRUE)
            s <- gsub('"', '\\"', s, fixed=TRUE)
            s
          }

          rows <- vapply(seq_len(nrow(out)), function(i) {
            prev <- if (is.na(out$previous_rank[i])) "null" else as.character(as.integer(out$previous_rank[i]))
            chg <- if (is.na(out$rank_change[i])) "null" else as.character(as.integer(out$rank_change[i]))
            sprintf(
              '{"rank":%d,"name":"%s","points":%d,"previous_rank":%s,"rank_change":%s}',
              as.integer(out$rank[i]),
              esc(as.character(out$name[i])),
              as.integer(out$points[i]),
              prev, chg
            )
          }, character(1))

          payload <- paste0(
            '{"snapshot":"2025-12-01","previous_snapshot":"2025-11-24",',
            '"source":"Thibaud-Meynier/Tennis-Data V_RACE_RANK_2025",',
            '"week":49,"count":', nrow(out),
            ',"rows":[', paste(rows, collapse=","), ']}'
          )
          writeLines(payload, "/tmp/race-out/atp-race-2025-12-01.json", useBytes=TRUE)
          cat("rows:", nrow(out), "\n")
          print(head(out, 25))
          RS

      - uses: actions/upload-artifact@v4
        with:
          name: atp-race-2025-12-01
          path: /tmp/race-out/atp-race-2025-12-01.json
          if-no-files-found: error
