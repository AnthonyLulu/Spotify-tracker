name: Scrape Tennis Snapshot

on:
  workflow_dispatch:
  push:
    branches: ["court-boss-live"]
    paths: [".github/workflows/scrape-tennis-snapshots.yml"]

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse ATP 2025-12-01 archive
        run: |
          mkdir -p court-boss/data
          cd /tmp
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
          cat > scrape.cjs <<'EOF'
          const fs=require('fs');
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1800}});
            await page.goto('https://hiyun0727.blogspot.com/2025/12/atp-ranking-20251201.html?m=1',{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForTimeout(2000);
            const rows=await page.locator('table tr').evaluateAll(trs=>trs.map(tr=>[...tr.querySelectorAll('th,td')].map(td=>(td.textContent||'').trim().replace(/\s+/g,' '))));
            const singles=[];
            for(const cells of rows){
              if(cells.length<3)continue;
              const rank=Number(String(cells[0]).replace(/[^0-9]/g,''));
              const name=String(cells[1]||'').trim();
              const pts=Number(String(cells[2]||'').replace(/[^0-9]/g,''));
              if(rank>0&&name&&pts>=0)singles.push({rank,name,points:pts});
            }
            const uniq=[...new Map(singles.map(x=>[x.rank,x])).values()].sort((a,b)=>a.rank-b.rank);
            fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/court-boss/data/atp-singles-2025-12-01.json',JSON.stringify({snapshot:'2025-12-01',source:'Hiyun archive mirroring ATP ranking',count:uniq.length,rows:uniq},null,2));
            await browser.close();
            if(uniq.length<200)throw new Error('Only parsed '+uniq.length+' ranking rows');
            console.log('parsed',uniq.length,'singles rows');
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node scrape.cjs
      - name: Commit ranking snapshot
        run: |
          git config user.name "Court Boss Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add court-boss/data/atp-singles-2025-12-01.json
          git diff --cached --quiet || git commit -m "Import ATP singles snapshot 2025-12-01"
          git push
