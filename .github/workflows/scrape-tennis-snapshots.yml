name: Build ATP Deep Snapshot

on:
  workflow_dispatch:
  push:
    branches: ["court-boss-live"]
    paths: [".github/workflows/scrape-tennis-snapshots.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build deep ATP snapshot for 2025-12-01
        run: |
          set -euo pipefail
          mkdir -p court-boss/data /tmp/atp
          curl --fail --silent --show-error             https://raw.githubusercontent.com/Kadantte/tennis_atp/master/atp_rankings_20s.csv             -o /tmp/atp/rankings.csv
          curl --fail --silent --show-error             https://raw.githubusercontent.com/Kadantte/tennis_atp/master/atp_players.csv             -o /tmp/atp/players.csv

          python3 <<'PY'
          import csv, json, unicodedata, re
          from pathlib import Path

          CUR='20251201'
          PREV='20251124'

          def norm(s):
              s=unicodedata.normalize('NFKD',s or '').encode('ascii','ignore').decode().lower()
              return re.sub(r'[^a-z0-9]+','',s)

          players={}
          with open('/tmp/atp/players.csv',encoding='utf-8',errors='ignore') as fh:
              for r in csv.DictReader(fh):
                  pid=(r.get('player_id') or '').strip()
                  if not pid: continue
                  first=(r.get('name_first') or r.get('first_name') or '').strip()
                  last=(r.get('name_last') or r.get('last_name') or '').strip()
                  name=' '.join(x for x in [first,last] if x).strip()
                  players[pid]={
                      'name':name,
                      'name_norm':norm(name),
                      'country':(r.get('ioc') or r.get('country_code') or '').strip(),
                      'birth_date':(r.get('dob') or r.get('birth_date') or '').strip()
                  }

          cur_by_pid={}
          prev_by_pid={}
          with open('/tmp/atp/rankings.csv',encoding='utf-8',errors='ignore') as fh:
              reader=csv.DictReader(fh)
              for r in reader:
                  d=(r.get('ranking_date') or '').strip()
                  if d not in (CUR,PREV): continue
                  pid=(r.get('player') or r.get('player_id') or '').strip()
                  p=players.get(pid)
                  if not p or not p['name']: continue
                  raw_rank=(r.get('rank') or r.get('ranking') or '').strip()
                  raw_pts=(r.get('points') or r.get('ranking_points') or '').strip()
                  try: rank=int(float(raw_rank))
                  except: continue
                  try: pts=int(float(raw_pts)) if raw_pts else 0
                  except: pts=0

                  row={
                      'rank':rank,
                      'player_id':int(pid),
                      'name':p['name'],
                      'name_norm':p['name_norm'],
                      'country':p['country'],
                      'birth_date':p['birth_date'],
                      'points':pts
                  }

                  # Some archive rows are duplicated for the same ATP player/date.
                  # Keep the strongest points total, then the best rank.
                  bucket=cur_by_pid if d==CUR else prev_by_pid
                  old=bucket.get(pid)
                  if old is None or pts>old['points'] or (pts==old['points'] and rank<old['rank']):
                      bucket[pid]=row

          cur=sorted(cur_by_pid.values(),key=lambda x:(x['rank'],x['name']))
          for x in cur:
              prev=prev_by_pid.get(str(x['player_id']))
              pr=prev['rank'] if prev else None
              x['previous_rank']=pr
              x['rank_change']=None if pr is None else pr-x['rank']

          if len(cur)<1800:
              raise SystemExit(f'Expected deep 2025-12-01 snapshot, got only {len(cur)} rows')

          payload={
              'snapshot':'2025-12-01',
              'previous_snapshot':'2025-11-24',
              'source':'Kadantte/tennis_atp historical ranking mirror',
              'license':'CC BY-NC-SA 4.0',
              'count':len(cur),
              'rows':cur
          }
          out=Path('court-boss/data/atp-singles-deep-2025-12-01.json')
          out.write_text(json.dumps(payload,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          print('rows',len(cur),'min',cur[0]['rank'],'max',cur[-1]['rank'])
          print('top5',cur[:5])
          print('tail',cur[-5:])
          PY

      - name: Commit compact snapshot
        run: |
          git config user.name "Court Boss Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add court-boss/data/atp-singles-deep-2025-12-01.json
          git diff --cached --quiet || git commit -m "Build deep ATP snapshot for 2025-12-01"
          git push
