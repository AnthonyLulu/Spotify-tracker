name: Build ATP Movement Snapshot

on:
  workflow_dispatch:
  push:
    branches: ["court-boss-live"]
    paths: [".github/workflows/scrape-tennis-snapshots.yml"]

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scrape exact ATP archive snapshots
        run: |
          mkdir -p court-boss/data
          cd /tmp
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
          cat > scrape.cjs <<'EOF'
          const fs=require('fs');
          const {chromium}=require('playwright');

          async function scrape(page,url,snapshot){
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForTimeout(1500);
            const rows=await page.locator('table tr').evaluateAll(trs=>trs.map(tr=>[...tr.querySelectorAll('th,td')].map(td=>(td.textContent||'').trim().replace(/\s+/g,' '))));
            const out=[];
            for(const cells of rows){
              if(cells.length<3)continue;
              const rank=Number(String(cells[0]).replace(/[^0-9]/g,''));
              const name=String(cells[1]||'').trim();
              const points=Number(String(cells[2]||'').replace(/[^0-9]/g,''));
              if(rank>0&&name&&points>=0)out.push({rank,name,points});
            }
            const uniq=[...new Map(out.map(x=>[x.rank,x])).values()].sort((a,b)=>a.rank-b.rank);
            if(uniq.length<190)throw new Error(snapshot+' parsed only '+uniq.length+' rows');
            return {snapshot,count:uniq.length,source:url,rows:uniq};
          }

          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1280,height:1200}});
            const current=await scrape(page,'https://hiyun0727.blogspot.com/2025/12/atp-ranking-20251201.html?m=1','2025-12-01');
            const previous=await scrape(page,'https://hiyun0727.blogspot.com/2025/11/atp-ranking-20251117.html?m=1','2025-11-17');

            const prevByName=new Map(previous.rows.map(x=>[x.name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,''),x.rank]));
            current.rows=current.rows.map(x=>{
              const key=x.name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
              const prev=prevByName.get(key)??null;
              return {...x,previous_rank:prev,rank_change:prev==null?null:prev-x.rank};
            });

            fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/court-boss/data/atp-singles-2025-12-01.json',JSON.stringify(current,null,2));
            fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/court-boss/data/atp-singles-2025-11-17.json',JSON.stringify(previous,null,2));
            console.log('current',current.count,'previous',previous.count);
            console.log(current.rows.slice(0,12));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node scrape.cjs

      - name: Commit snapshots
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "Court Boss Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add court-boss/data/atp-singles-2025-12-01.json court-boss/data/atp-singles-2025-11-17.json
          git diff --cached --quiet || git commit -m "Add ATP rank movement for 2025-12-01"
          git push
