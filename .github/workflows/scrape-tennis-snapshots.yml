name: Scrape Tennis Snapshot

on:
  workflow_dispatch:
  push:
    branches: ["court-boss-live"]
    paths: [".github/workflows/scrape-tennis-snapshots.yml"]

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scrape official historical ranking pages
        run: |
          mkdir -p court-boss/data
          cd /tmp
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
          cat > scrape.cjs <<'EOF'
          const fs=require('fs');
          const {chromium}=require('playwright');

          async function inspect(page,url,label){
            const api=[];
            page.on('response',r=>{
              const u=r.url();
              if(/rank|standing|tennis|player/i.test(u)&&/api|ajax|graphql|ranking|rank/i.test(u)){
                api.push({status:r.status(),url:u,ct:r.headers()['content-type']||''});
              }
            });
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForTimeout(5000);
            const body=await page.locator('body').innerText().catch(()=> '');
            return {url:page.url(),title:await page.title(),api:api.slice(-100),sample:body.slice(0,30000)};
          }

          (async()=>{
            const browser=await chromium.launch({headless:true});
            const out={};
            const urls={
              singles:'https://www.atptour.com/en/rankings/singles?rankRange=0-100&region=all&dateWeek=2025-12-01',
              doubles:'https://www.atptour.com/en/rankings/doubles?rankRange=0-100&region=all&dateWeek=2025-12-01',
              race:'https://www.atptour.com/en/rankings/singles-race-to-turin?rankRange=0-100&region=all&dateWeek=2025-12-01',
              doublesRace:'https://www.atptour.com/en/rankings/doubles-race-to-turin?rankRange=0-100&region=all&dateWeek=2025-12-01',
              junior:'https://www.itftennis.com/en/rankings/world-tennis-tour-junior-rankings/'
            };
            for(const [label,url] of Object.entries(urls)){
              const page=await browser.newPage({viewport:{width:1440,height:1800}});
              out[label]=await inspect(page,url,label);
              await page.close();
            }
            const archive=await browser.newPage({viewport:{width:1440,height:1800}});
            out.singlesArchive=await inspect(archive,'https://hiyun0727.blogspot.com/2025/12/atp-ranking-20251201.html?m=1','singlesArchive');
            await archive.close();
            fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/court-boss/data/snapshot-diagnostic.json',JSON.stringify(out,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node scrape.cjs
      - name: Commit diagnostic
        run: |
          git config user.name "Court Boss Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add court-boss/data/snapshot-diagnostic.json
          git diff --cached --quiet || git commit -m "Refresh historical tennis ranking source"
          git push
