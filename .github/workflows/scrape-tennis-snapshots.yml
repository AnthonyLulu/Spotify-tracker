name: Import ATP Historical Snapshot

on:
  workflow_dispatch:
  push:
    branches: ["court-boss-live"]
    paths: [".github/workflows/scrape-tennis-snapshots.yml"]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download complete ATP snapshots
        run: |
          mkdir -p court-boss/data
          curl --fail --silent --show-error             https://atp-rankings-data-visualization.onrender.com/api/week/2025-12-01             -o court-boss/data/atp-singles-2025-12-01.json
          curl --fail --silent --show-error             https://atp-rankings-data-visualization.onrender.com/api/week/2025-11-24             -o court-boss/data/atp-singles-2025-11-24.json
          node <<'EOF'
          const fs=require('fs');
          for(const file of ['2025-12-01','2025-11-24']){
            const p='court-boss/data/atp-singles-'+file+'.json';
            const x=JSON.parse(fs.readFileSync(p,'utf8'));
            const rows=x.rankings||x.rows||[];
            if(rows.length<1000) throw new Error(file+' only '+rows.length+' rows');
            console.log(file,rows.length,'ranked players',rows[0],rows[rows.length-1]);
          }
          EOF

      - name: Commit snapshots
        run: |
          git config user.name "Court Boss Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add court-boss/data/atp-singles-2025-12-01.json court-boss/data/atp-singles-2025-11-24.json
          git diff --cached --quiet || git commit -m "Import complete ATP snapshots around 2025-12-01"
          git push
