function load(){try{return {...defaultState,...JSON.parse(localStorage.getItem('courtBossState')||'{}')}}catch{return structuredClone(defaultState)}}
let state=load(), players=buildPlayers(), route='home', profile=null, profileTab='overview', tournamentModal=null, rankMode='singles', rankPage=0, rankPerPage=100, calendarFilter='Tous', mgmtTab='training', moreTab='hub';

async function cloudInit(){try{const r=await fetch(API_BASE+'/api/bootstrap',{headers:{'X-Save-Key':cloudSaveKey}});if(!r.ok)throw new Error('bootstrap '+r.status);const d=await r.json();if(Array.isArray(d.players)&&d.players.length){players=d.players.map(p=>({id:String(p.id),name:p.name,country:p.country,rank:p.ranking,points:p.points,doubleRank:p.doubles_ranking||9999,age:p.age||0,height:p.height_cm||0,weight:p.weight_kg||0,handed:p.handedness||'—',backhand:p.backhand||'—',ca:p.current_ability||50,potential:p.potential||50,form:p.form||70,fitness:p.fitness||90,morale:p.morale||75,fatigue:p.fatigue||15,style:p.style||'Non renseigné',attrs:attrsFromCloud(p.player_attributes),scout:p.scouting_confidence||70,real:!!p.is_real}))}if(d.save){state={...defaultState,...d.save};localStorage.setItem('courtBossState',JSON.stringify(state))}if(Array.isArray(d.tournaments)&&d.tournaments.length){tournaments=d.tournaments.map(t=>[t.name,t.city,t.country,t.surface,t.level,t.start_date,t.direct_cut,t.qual_cut])}if(Array.isArray(d.news)&&d.news.length&&!d.save){state.news=d.news.map(x=>x.body).slice(0,6)}render()}catch(e){console.warn('Mode local actif',e)}}

function rankings(){

  <div class="notice mini" style="margin:8px 0 12px"><b>Challenger n'est pas un classement séparé.</b> Les joueurs gardent leur classement ATP et les Challengers sont des catégories de tournois dans le calendrier.</div>

function rankTable(list){return `<table class="table"><thead><tr><th>#</th><th>Joueur</th><th>Pts</th><th>Évolution</th></tr></thead><tbody>${list.map(p=>{const r=rankMode==='doubles'?p.doubleRank:p.rank;return `<tr class="click" onclick="openPlayer('${p.id}')"><td><b>${r}</b></td><td>${flags[p.country]||'🏳️'} ${p.name}</td><td>${rankMode==='doubles'?'—':fmt(p.points)}</td><td class="${seeded(r,33)>.5?'good':'bad'}">${seeded(r,33)>.5?'▲':'▼'} ${1+Math.floor(seeded(r,34)*5)}</td></tr>`}).join('')}</tbody></table>`}
window.renderRankingRows=q=>{const x=q.toLowerCase();const base=(rankMode==='doubles'?players.slice().sort((a,b)=>a.doubleRank-b.doubleRank):players.slice().sort((a,b)=>a.rank-b.rank));$('#rankRows').innerHTML=rankTable(base.filter(p=>(p.name+' '+p.country).toLowerCase().includes(x)).slice(0,100))}
function jumpToRank(){const n=Math.max(1,Math.min(2000,Number($('#jumpRank')?.value||1)));rankPage=Math.floor((n-1)/rankPerPage);render()}
function playersPage(){return `<div class="section-title"><div><div class="kicker">Scouting mondial</div><h1>Base joueurs</h1></div><span class="pill">${players.length} profils</span></div><div class="grid g2"><input class="search" placeholder="Nom, pays, style…" oninput="renderPlayerGrid(this.value)"><button class="ghost" onclick="moreTab='scouting';go('more')">Ouvrir le centre de scouting</button></div><div id="playerGrid" class="grid g3" style="margin-top:14px">${players.slice(0,60).map(pCard).join('')}</div>`}
window.renderPlayerGrid=q=>{const x=q.toLowerCase();$('#playerGrid').innerHTML=players.filter(p=>(p.name+' '+p.country+' '+p.style).toLowerCase().includes(x)).slice(0,120).map(pCard).join('')||'<div class="empty">Aucun joueur</div>'}
function calendar(){
  const filters=['Tous','Grand Chelem','Masters','ATP','Challenger','ITF','NCAA','Davis'];
  const match=t=>calendarFilter==='Tous'||(calendarFilter==='Grand Chelem'&&/Grand Slam|Grand Chelem/i.test(t[4]))||(calendarFilter==='Masters'&&/Masters/i.test(t[4]))||(calendarFilter==='ATP'&&/^ATP/i.test(t[4]))||(calendarFilter==='Challenger'&&/Challenger/i.test(t[4]))||(calendarFilter==='ITF'&&/M15|M25|ITF/i.test(t[4]))||(calendarFilter==='NCAA'&&/NCAA/i.test(t[4]))||(calendarFilter==='Davis'&&/Davis/i.test(t[4]));
  const shown=tournaments.map((t,i)=>({t,i})).filter(x=>match(x.t));
  return `<div class="section-title"><div><div class="kicker">Saison 2026</div><h1>Calendrier & inscriptions</h1></div><span class="pill">${shown.length} événements</span></div>
  <div class="filterbar">${filters.map(f=>`<button class="${calendarFilter===f?'active':''}" onclick="calendarFilter='${f}';render()">${f}</button>`).join('')}</div>
  <div class="stack">${shown.map(({t,i})=>{const joined=state.entries.includes(i);const elig=t[6]==null?'Éligibilité spéciale':state.managed.rank<=t[6]?'Tableau direct':state.managed.rank<=t[7]?'Qualifications':'Alternate';return `<div class="card tournament-card" onclick="openTournament(${i})"><div class="row between"><div><div class="kicker">${t[4]}</div><h3>${flags[t[2]]||'🏳️'} ${t[0]}</h3><div class="muted">${t[1]} · ${datefr(t[5])} · <span class="surface-${t[3]==='Dur'?'hard':t[3]==='Terre'?'clay':'grass'}">${t[3]}</span></div></div><div style="text-align:right"><span class="badge ${elig==='Tableau direct'?'good':elig==='Qualifications'?'warn':''}">${elig}</span><p><button class="${joined?'ghost danger':'primary'}" onclick="event.stopPropagation();toggleEntry(${i})">${joined?'Se désinscrire':'S’inscrire'}</button></p></div></div></div>`}).join('')}</div>`
}
function toggleEntry(i){state.entries=state.entries.includes(i)?state.entries.filter(x=>x!==i):[...state.entries,i];save();render()}
function openTournament(i){tournamentModal=i;render()}
function tournamentModalHtml(){const i=tournamentModal,t=tournaments[i];if(!t)return '';const joined=state.entries.includes(i);const elig=t[6]==null?'Éligibilité spéciale':state.managed.rank<=t[6]?'Tableau direct':state.managed.rank<=t[7]?'Qualifications':'Alternate';return `<div class="modal" onclick="if(event.target===this){tournamentModal=null;render()}"><div class="modal-box"><div class="modal-head"><div><div class="kicker">${t[4]}</div><h1 style="margin:3px 0">${flags[t[2]]||'🏳️'} ${t[0]}</h1><div class="muted">${t[1]} · ${datefr(t[5])} · ${t[3]}</div></div><button class="close" onclick="tournamentModal=null;render()">✕</button></div><div class="grid g3" style="margin-top:14px"><div class="card"><span class="muted">Cut direct</span><strong style="display:block;font-size:24px">${t[6]?'#'+t[6]:'—'}</strong></div><div class="card"><span class="muted">Cut qualifs</span><strong style="display:block;font-size:24px">${t[7]?'#'+t[7]:'—'}</strong></div><div class="card"><span class="muted">Statut Anthony</span><strong style="display:block;font-size:20px">${elig}</strong></div></div><div class="card" style="margin-top:12px"><h3>Gestion du tournoi</h3><div class="option-row"><span>Simple</span><span class="badge">Disponible</span></div><div class="option-row"><span>Double</span><span class="badge">Selon partenaire</span></div><div class="option-row"><span>Conflits calendrier</span><span class="badge ${state.entries.some((e)=>e!==i&&tournaments[e]?.[5]===t[5])?'bad':'good'}">${state.entries.some((e)=>e!==i&&tournaments[e]?.[5]===t[5])?'Conflit détecté':'Aucun'}</span></div><p><button class="${joined?'ghost danger':'primary'}" onclick="toggleEntry(${i});tournamentModal=null">${joined?'Se désinscrire':'S’inscrire au tournoi'}</button></p></div></div></div>`}
function management(){
 const tabs=[['training','Entraînement'],['staff','Staff'],['medical','Médical'],['academy','Académie'],['tactics','Tactique'],['finance','Finances']];
 return `<div class="section-title"><div><div class="kicker">Performance & carrière</div><h1>Gestion</h1></div></div><div class="tabs" style="margin-bottom:12px">${tabs.map(t=>`<button class="${mgmtTab===t[0]?'active':''}" onclick="mgmtTab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>${managementBody()}`
}
function managementBody(){
 if(mgmtTab==='staff')return `<div class="grid g2">${state.staff.map((x,i)=>`<div class="card click" onclick="alert('${x[0]} · niveau ${x[1]}/20 · coût ${fmt(x[2])} €/semaine')"><div class="kicker">Membre du staff</div><h3>${x[0]}</h3><div class="metric"><strong>${x[1]}/20</strong><span>${fmt(x[2])} €/sem.</span></div><div class="statbar"><i style="width:${x[1]*5}%"></i></div></div>`).join('')}</div>`;
 if(mgmtTab==='medical')return `<div class="grid g2"><div class="card"><h3>État médical</h3><div class="metric"><span>Fitness</span><strong>${state.managed.fitness}</strong></div><div class="statbar"><i style="width:${state.managed.fitness}%"></i></div><div class="metric" style="margin-top:14px"><span>Fatigue</span><strong>${state.managed.fatigue}</strong></div><div class="statbar"><i style="width:${state.managed.fatigue}%"></i></div><p class="notice mini">Une charge élevée, les voyages et l'enchaînement de matchs augmentent le risque. Une rechute peut prolonger l'absence.</p></div><div class="card"><h3>Plan de récupération</h3><div class="option-row"><span>Repos complet</span><button class="ghost" onclick="state.training=state.training.map(()=> 'Repos');save();render()">Appliquer</button></div><div class="option-row"><span>Récupération active</span><button class="ghost" onclick="state.training=state.training.map((x,i)=>i%2?'Récupération':'Repos');save();render()">Appliquer</button></div><div class="option-row"><span>Risque actuel</span><span class="badge ${state.managed.fatigue>45?'bad':state.managed.fatigue>25?'warn':'good'}">${state.managed.fatigue>45?'Élevé':state.managed.fatigue>25?'Modéré':'Faible'}</span></div></div></div>`;
 if(mgmtTab==='academy')return `<div class="grid g2"><div class="card"><h3>Académie Court Boss</h3>${state.facilities.map((x,i)=>`<div class="row between news click"><div><b>${x[0]}</b><div class="muted">Niveau ${x[1]}/5</div></div><button class="ghost" onclick="upgrade(${i})">Améliorer · ${fmt(2500*x[1])} €</button></div>`).join('')}</div><div class="card"><h3>Objectifs du board</h3><div class="news">Atteindre le Top 500 <span class="badge">${state.managed.rank<=500?'Validé':'En cours'}</span></div><div class="news">Solde positif <span class="badge ${state.managed.budget>=0?'good':'bad'}">${state.managed.budget>=0?'OK':'Alerte'}</span></div><div class="news">Développer une installation niveau 3+</div></div></div>`;
 if(mgmtTab==='tactics')return `<div class="grid g2"><div class="card"><h3>Plan de jeu</h3><div class="option-row"><span>Agressivité</span><input class="range" type="range" min="1" max="100" value="62"></div><div class="option-row"><span>Prise de risque</span><input class="range" type="range" min="1" max="100" value="55"></div><div class="option-row"><span>Montées au filet</span><input class="range" type="range" min="1" max="100" value="35"></div><div class="option-row"><span>Position au retour</span><select class="select"><option>Neutre</option><option>Avancée</option><option>Reculée</option></select></div></div><div class="card"><h3>Préparation adversaire</h3><p class="muted">Le plan de match utilisera service, retour, surfaces, forme, fatigue et style adverse.</p><button class="primary" onclick="moreTab='match';go('more')">Ouvrir Match Center</button></div></div>`;
 if(mgmtTab==='finance')return `<div class="grid g2"><div class="card"><h3>Finances</h3><div class="grid g2"><div><span class="muted">Solde</span><strong style="display:block;font-size:25px">${fmt(state.managed.budget)} €</strong></div><div><span class="muted">Prize money</span><strong style="display:block;font-size:25px">${fmt(state.finance.prize)} €</strong></div><div><span class="muted">Staff / semaine</span><b>${fmt(state.finance.staff)} €</b></div><div><span class="muted">Voyages</span><b>${fmt(state.finance.travel)} €</b></div></div></div><div class="card"><h3>Contrats & sponsors</h3><div class="news">Agent : négociation sponsor <span class="badge">Disponible au Top 500</span></div><div class="news">Prime de tournoi : dépend du circuit et du tour atteint</div><div class="news">Budget staff : impact direct sur la progression</div></div></div>`;
 return `<div class="grid g2"><div class="card"><h3>Programme hebdomadaire</h3><div class="stack">${state.training.map((x,i)=>`<div class="training-slot"><span>Jour ${i+1}</span><select class="select" onchange="setTraining(${i},this.value)">${['Service','Retour','Coup droit','Revers','Déplacements','Endurance','Match play','Double','Récupération','Repos'].map(v=>`<option ${v===x?'selected':''}>${v}</option>`).join('')}</select></div>`).join('')}</div><p class="notice mini">Objectif forme ou progression : la charge influence fatigue, forme et risque de blessure.</p></div><div class="card"><h3>Charge de la semaine</h3><div class="metric"><span>Charge estimée</span><strong>${state.training.filter(x=>!['Repos','Récupération'].includes(x)).length}/7</strong></div><p class="muted">Périodise la saison : préparation, pic de forme, récupération après tournoi.</p><button class="ghost" onclick="mgmtTab='medical';render()">Voir le risque médical</button></div></div>`
}
function setTraining(i,v){state.training[i]=v;save()}
function upgrade(i){const cost=2500*state.facilities[i][1];if(state.managed.budget<cost)return alert('Budget insuffisant');if(state.facilities[i][1]>=5)return alert('Installation au maximum');state.managed.budget-=cost;state.facilities[i][1]++;save();render()}
function davis(){const fr=players.filter(p=>p.country==='FRA').slice(0,14);return `<div class="section-title"><div><div class="kicker">Fédération française</div><h1>Coupe Davis</h1></div><span class="pill">Réputation 88/100</span></div><div class="grid g2"><div class="card"><h3>Groupe France</h3>${fr.map(p=>`<div class="row between news click" onclick="openPlayer('${p.id}')"><span>${flags.FRA} ${p.name}</span><b>#${p.rank}</b></div>`).join('')}</div><div class="card"><div class="kicker">Prochaine rencontre</div><h2>France vs Italie</h2><p class="muted">Final 8 · Bologne · Dur indoor</p><div class="stack"><div class="training-slot"><span>Simple 1</span><b>Arthur Fils</b></div><div class="training-slot"><span>Simple 2</span><b>Ugo Humbert</b></div><div class="training-slot"><span>Double</span><b>Doumbia / Reboul</b></div></div><p class="notice mini">Format Final 8 : deux simples puis un double décisif si nécessaire.</p></div></div>`}

 </div>`

function scoutingCenter(){const prospects=players.filter(p=>p.age<=23).sort((a,b)=>(b.potential||0)-(a.potential||0)).slice(0,30);return `<div class="section-title"><div><div class="kicker">Recrutement</div><h1>Centre de scouting</h1></div><button class="ghost" onclick="moreTab='hub';render()">Retour</button></div><input class="search" placeholder="Rechercher un joueur…" oninput="renderScout(this.value)"><div id="scoutGrid" class="grid g3" style="margin-top:12px">${prospects.map(pCard).join('')}</div>`}

function matchCenter(){const opp=players.find(p=>p.rank===Math.max(1,state.managed.rank-10))||players[20];return `<div class="section-title"><div><div class="kicker">Préparation tactique</div><h1>Match Center</h1></div><button class="ghost" onclick="moreTab='hub';render()">Retour</button></div><div class="grid g2"><div class="card click" onclick="openPlayer('${opp.id}')"><div class="kicker">Adversaire simulé</div><h2>${flags[opp.country]||'🏳️'} ${opp.name}</h2><p class="muted">#${opp.rank} · ${opp.style}</p><div class="row between"><span>Forme</span><b>${opp.form}</b></div><div class="row between"><span>Fatigue</span><b>${opp.fatigue}</b></div></div><div class="card"><h3>Consignes</h3><div class="option-row"><span>Direction service</span><select class="select"><option>Variée</option><option>Revers</option><option>Corps</option></select></div><div class="option-row"><span>Longueur échanges</span><select class="select"><option>Adaptative</option><option>Courte</option><option>Longue</option></select></div><div class="option-row"><span>Montées au filet</span><select class="select"><option>Occasionnelles</option><option>Fréquentes</option></select></div></div><div class="card"><h3>Analyse disponible</h3><p class="muted">Zones de service, schémas de rallye, longueur d'échange, winners/fautes et efficacité par surface seront stockés match par match.</p></div><div class="card"><h3>Simuler le prochain match</h3><button class="primary" onclick="simulateMatch()">Jouer le match</button><div id="matchResult" style="margin-top:12px"></div></div></div>`}

 if(profileTab==='matches'){return `<div class="card"><h3>Matchs récents</h3>${Array.from({length:8},(_,i)=>{const opp=players[(Math.max(1,p.rank)+i*17)%players.length];return `<div class="row between news click" onclick="openPlayer('${opp.id}')"><div><b>${i%4===3?'D':'V'} vs ${opp.name}</b><div class="muted mini">${['6-4 6-3','7-6 3-6 6-2','6-2 6-4','4-6 6-7'][i%4]} · Dur</div></div><span class="badge">Voir profil</span></div>`}).join('')}</div>`}
 if(profileTab==='development'){return `<div class="grid g2"><div class="card"><h3>Courbe de développement</h3><div class="metric"><span>Niveau actuel</span><strong>${Math.round(p.ca)}</strong></div><div class="statbar"><i style="width:${p.ca}%"></i></div><div class="metric" style="margin-top:14px"><span>Potentiel</span><strong>${Math.round(p.potential)}</strong></div><div class="statbar"><i style="width:${p.potential}%"></i></div></div><div class="card"><h3>Axes recommandés</h3>${p.attrs.slice().sort((a,b)=>a[1]-b[1]).slice(0,4).map(a=>`<div class="news"><b>${a[0]}</b><span style="float:right">${a[1]}/20</span></div>`).join('')}</div></div>`}
 if(profileTab==='attributes')return `<div class="notice">Les notes 1–20 ci-dessous sont des évaluations de scouting pour le jeu. Elles ne constituent pas des statistiques officielles ATP.</div><div class="attr-grid" style="margin-top:12px">${p.attrs.map(a=>`<div class="attr"><span>${a[0]}</span><b class="${a[1]>=16?'good':a[1]<=8?'bad':''}">${a[1]}</b><div class="statbar"><i style="width:${a[1]*5}%"></i></div></div>`).join('')}</div><p class="muted">Confiance scouting : ${p.scout}%</p>`;if(profileTab==='career'){const titles=p.rank<=10?4:p.rank<=30?2:p.rank<=100?1:0;return `<div class="grid g3"><div class="card"><div class="kicker">Titres 2026</div><strong style="font-size:30px">${titles}</strong></div><div class="card"><div class="kicker">Bilan saison</div><strong style="font-size:30px">${Math.max(3,38-Math.floor(p.rank/20))}-${Math.max(2,8+Math.floor(p.rank/30))}</strong></div><div class="card"><div class="kicker">Meilleur classement</div><strong style="font-size:30px">#${Math.max(1,p.rank-Math.floor(seeded(p.rank,90)*15))}</strong></div></div><div class="card" style="margin-top:12px"><h3>Palmarès récent</h3>${titles?Array.from({length:titles},(_,i)=>`<div class="news"><b>${['ATP 500 Rotterdam','Masters 1000 Rome','ATP 250 Marseille','Challenger Bordeaux'][i%4]}</b><div class="muted">2026 · ${i%2?'Terre battue':'Dur'} · ${i%2?'Masters/ATP':'ATP/Challenger'}</div></div>`).join(''):'<div class="empty">Aucun titre enregistré cette saison.</div>'}</div>`}if(profileTab==='commercial'){const sp=sponsors[p.name];return `<div class="card"><h3>Partenaires commerciaux</h3>${sp?sp.map(s=>`<span class="badge" style="margin:4px">${s}</span>`).join(''):'<div class="empty">Non vérifié</div>'}<p class="muted mini">Seuls les sponsors explicitement vérifiés sont affichés. Les autres profils restent volontairement non renseignés.</p></div>`}if(profileTab==='history'){const base=p.rank;return `<div class="card"><h3>Historique de classement</h3>${Array.from({length:8},(_,i)=>`<div class="row between news"><span>S-${7-i}</span><b>#${Math.max(1,base+Math.round((seeded(base,i+140)-.5)*18))}</b></div>`).join('')}</div>`}return `<div class="grid g2"><div class="card"><h3>Profil</h3><div class="grid g2"><div><span class="muted">Main</span><b style="display:block">${p.handed}</b></div><div><span class="muted">Revers</span><b style="display:block">${p.backhand}</b></div><div><span class="muted">Style</span><b style="display:block">${p.style}</b></div><div><span class="muted">Double</span><b style="display:block">#${p.doubleRank}</b></div></div></div><div class="card"><h3>Niveau & potentiel</h3><div class="metric"><span>Capacité actuelle</span><strong>${Math.round(p.ca)}</strong></div><div class="statbar"><i style="width:${p.ca}%"></i></div><br><div class="metric"><span>Potentiel</span><strong>${Math.round(p.potential)}</strong></div><div class="statbar"><i style="width:${p.potential}%"></i></div></div><div class="card"><h3>Condition</h3>${[['Forme',p.form],['Fitness',p.fitness],['Moral',p.morale],['Fatigue',p.fatigue]].map(x=>`<div style="margin:10px 0"><div class="row between"><span>${x[0]}</span><b>${x[1]}</b></div><div class="statbar"><i style="width:${x[1]}%"></i></div></div>`).join('')}</div><div class="card"><h3>Derniers résultats</h3>${Array.from({length:4},(_,i)=>{const opp=players[(Math.max(1,p.rank)+i*13)%players.length];return `<div class="news click" onclick="openPlayer('${opp.id}')"><b class="${i===3?'bad':'good'}">${i===3?'D':'V'}</b> vs ${opp.name}<div class="muted mini">${['6-4 6-3','7-6 3-6 6-2','6-2 6-4','4-6 6-7'][i]} · Dur · cliquer pour profil</div></div>`}).join('')}</div></div>`}
function simulateWeek(){const m=state.managed;const load=state.training.reduce((a,x)=>a+(['Endurance','Match play','Déplacements','Service','Retour','Coup droit','Revers'].includes(x)?2:x==='Récupération'||x==='Repos'?-1:1),0);m.fatigue=Math.max(0,Math.min(100,m.fatigue+load-Math.round(seeded(state.week,2)*8)));m.fitness=Math.max(40,Math.min(100,m.fitness+(load<=8?2:-2)));m.form=Math.max(30,Math.min(100,m.form+Math.round((seeded(state.week,3)-.42)*8)));m.morale=Math.max(30,Math.min(100,m.morale+Math.round((seeded(state.week,4)-.45)*6)));if(load>10&&seeded(state.week,5)>.78){m.fitness-=8;state.news.unshift('Alerte médicale : petite gêne musculaire après une semaine trop chargée.')}const improve=seeded(state.week,6)>.45;if(improve&&m.rank>80){m.rank=Math.max(1,m.rank-(1+Math.floor(seeded(state.week,7)*12)));m.points+=4+Math.floor(seeded(state.week,8)*15);state.finance.prize+=350+Math.floor(seeded(state.week,9)*1200);m.budget+=state.finance.prize?Math.floor(200+seeded(state.week,10)*800):0}else{m.rank+=Math.floor(seeded(state.week,11)*5)}m.budget-=state.finance.staff;for(const p of players){const swing=Math.round((seeded(p.rank,state.week)-.5)*3);p.rank=Math.max(1,p.rank+swing);p.form=Math.max(35,Math.min(99,p.form+Math.round((seeded(p.rank,state.week+30)-.5)*8)))}const d=new Date(state.date+'T12:00:00');d.setDate(d.getDate()+7);state.date=d.toISOString().slice(0,10);state.week++;state.rankingHistory.push({date:state.date,rank:m.rank,points:m.points});state.news.unshift(`Semaine ${state.week-1} simulée : Anthony est désormais classé #${m.rank}.`);state.news=state.news.slice(0,6);save();render()}
function render(){let content=route==='home'?home():route==='calendar'?calendar():route==='rankings'?rankings():route==='players'?playersPage():route==='management'?management():route==='davis'?davis():more();app.innerHTML=shell(content)}
render();
cloudInit();

</script>
