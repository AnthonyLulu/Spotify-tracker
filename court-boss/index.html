  <style>
:root{--bg:#07100d;--panel:#0d1713;--panel2:#111f19;--line:#24332b;--text:#eef8f2;--muted:#91a89c;--accent:#b7ff46;--accent2:#35d78b;--danger:#ff6b74;--warn:#ffc857;--blue:#65a8ff;--shadow:0 14px 40px rgba(0,0,0,.28)}*{box-sizing:border-box}html,body{margin:0;background:linear-gradient(180deg,#06100c,#0a120f 45%,#070c0a);color:var(--text);font:14px/1.4 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100%}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.shell{max-width:1260px;margin:0 auto;min-height:100vh;padding-bottom:86px}.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:14px 18px;background:rgba(7,16,13,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.brand{font-weight:900;letter-spacing:.08em;font-size:19px}.brand b{color:var(--accent)}.grow{flex:1}.date-pill,.pill{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 10px;color:var(--muted);white-space:nowrap}.sim-btn{border:0;border-radius:12px;background:var(--accent);color:#0a120f;font-weight:900;padding:10px 13px}.page{padding:18px}.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}.card h2,.card h3{margin:0 0 10px}.muted{color:var(--muted)}.kicker{text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--accent);font-weight:800}.hero{display:grid;grid-template-columns:1.4fr .8fr;gap:14px}.hero-name{font-size:34px;font-weight:950;line-height:1}.rank{font-size:38px;font-weight:950}.metric{display:flex;align-items:end;justify-content:space-between;gap:8px}.metric strong{font-size:26px}.statbar{height:8px;border-radius:99px;background:#1f2d27;overflow:hidden;margin-top:7px}.statbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:99px}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.stack{display:flex;flex-direction:column;gap:10px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:left}.table th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.click{cursor:pointer}.click:hover{background:#12221b}.flag{font-size:17px}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 8px;background:#17261f;border:1px solid var(--line);font-size:12px}.good{color:var(--accent)}.bad{color:var(--danger)}.warn{color:var(--warn)}.nav{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:30;width:min(760px,calc(100% - 20px));display:flex;justify-content:space-around;padding:8px;background:rgba(13,23,19,.95);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.nav button{border:0;background:transparent;color:var(--muted);padding:9px 11px;border-radius:12px;font-size:12px}.nav button.active{background:#1b2b23;color:var(--accent);font-weight:850}.section-title{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px}.section-title h1{font-size:25px;margin:0}.search{width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:#0a1410;color:var(--text);outline:none}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:6px}.tabs button{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:8px 11px;border-radius:999px;white-space:nowrap}.tabs button.active{background:var(--accent);color:#07100d;border-color:var(--accent);font-weight:900}.attr-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.attr{background:#0a1410;border:1px solid var(--line);border-radius:12px;padding:10px}.attr b{font-size:18px;float:right}.timeline{border-left:2px solid var(--line);padding-left:14px}.event{padding:8px 0}.surface-hard{color:var(--blue)}.surface-clay{color:#ef945c}.surface-grass{color:#86dc85}.mini{font-size:12px}.news{padding:11px 0;border-bottom:1px solid var(--line)}.news:last-child{border:0}.training-slot{display:flex;justify-content:space-between;gap:8px;padding:11px;border:1px solid var(--line);border-radius:12px;background:#0a1410}.primary{border:0;border-radius:10px;background:var(--accent);color:#08100c;padding:9px 12px;font-weight:900}.ghost{border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--text);padding:8px 11px}.danger{border-color:#6e3338;color:#ff969c}.select{background:#0a1410;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:7px}.notice{border-left:3px solid var(--warn);padding:10px 12px;background:#211d10;color:#ffdf8a;border-radius:8px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:grid;place-items:center;z-index:50;padding:14px}.modal-box{width:min(850px,100%);max-height:92vh;overflow:auto;background:#0b1511;border:1px solid var(--line);border-radius:20px;padding:18px}.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.close{border:1px solid var(--line);background:#111e18;color:var(--text);width:36px;height:36px;border-radius:10px}.subnav{display:flex;gap:8px;flex-wrap:wrap}.subnav button{border:1px solid var(--line);background:#0d1713;color:var(--muted);padding:8px 10px;border-radius:9px}.subnav button.active{color:#08100c;background:var(--accent);font-weight:900}.empty{padding:25px;text-align:center;color:var(--muted)}@media(max-width:800px){.page{padding:13px}.topbar{padding:11px 12px}.hero{grid-template-columns:1fr}.g2,.g3,.g4{grid-template-columns:1fr}.attr-grid{grid-template-columns:1fr}.brand{font-size:16px}.date-pill{display:none}.sim-btn{padding:9px 10px;font-size:12px}.table th:nth-child(4),.table td:nth-child(4){display:none}.hero-name{font-size:29px}.nav{overflow-x:auto;justify-content:flex-start}.nav button{min-width:74px}.card{padding:13px;border-radius:15px}}

</style>

<body>
  <div id="app"></div>
  <script>
const $=s=>document.querySelector(s), app=$('#app');
const API_BASE='https://qrsvliliezbiedmaewml.supabase.co/functions/v1/court-boss';
const cloudSaveKey = (()=>{let k=localStorage.getItem('courtBossSaveKey');if(!k){k=crypto.randomUUID();localStorage.setItem('courtBossSaveKey',k)}return k})();
const flags={ITA:'🇮🇹',GER:'🇩🇪',ESP:'🇪🇸',USA:'🇺🇸',CAN:'🇨🇦',RUS:'🇷🇺',AUS:'🇦🇺',FRA:'🇫🇷',SRB:'🇷🇸',NOR:'🇳🇴',CZE:'🇨🇿',ARG:'🇦🇷',BRA:'🇧🇷',GBR:'🇬🇧',NED:'🇳🇱',BEL:'🇧🇪',SUI:'🇨🇭',AUT:'🇦🇹',JPN:'🇯🇵',CHN:'🇨🇳',KOR:'🇰🇷'};
const top20=[
['Jannik Sinner','ITA',11500],['Alexander Zverev','GER',9690],['Carlos Alcaraz','ESP',5560],['Ben Shelton','USA',4680],['Felix Auger-Aliassime','CAN',3890],['Daniil Medvedev','RUS',3770],['Flavio Cobolli','ITA',3720],['Frances Tiafoe','USA',3380],['Alex de Minaur','AUS',3300],['Taylor Fritz','USA',3175],['Arthur Fils','FRA',3150],['Novak Djokovic','SRB',2980],['Learner Tien','USA',2715],['Rafael Jodar','ESP',2659],['Jakub Mensik','CZE',2495],['Brandon Nakashima','USA',2410],['Casper Ruud','NOR',2335],['Tommy Paul','USA',2325],['Valentin Vacherot','MON',2250],['Luciano Darderi','ITA',2200]
];
const extraReal=[['Ugo Humbert','FRA'],['Giovanni Mpetshi Perricard','FRA'],['Corentin Moutet','FRA'],['Alexandre Muller','FRA'],['Benjamin Bonzi','FRA'],['Adrian Mannarino','FRA'],['Pierre-Hugues Herbert','FRA'],['Nicolas Mahut','FRA'],['Sadio Doumbia','FRA'],['Fabien Reboul','FRA'],['Andrey Rublev','RUS'],['Holger Rune','DEN'],['Lorenzo Musetti','ITA'],['Stefanos Tsitsipas','GRE'],['Grigor Dimitrov','BUL'],['Hubert Hurkacz','POL'],['Sebastian Korda','USA'],['Cameron Norrie','GBR'],['Jack Draper','GBR'],['Matteo Berrettini','ITA'],['Lorenzo Sonego','ITA'],['Tallon Griekspoor','NED'],['David Goffin','BEL'],['Denis Shapovalov','CAN'],['Gael Monfils','FRA'],['Stan Wawrinka','SUI'],['Sebastian Baez','ARG'],['Francisco Cerundolo','ARG'],['Joao Fonseca','BRA'],['Alex Michelsen','USA'],['Reilly Opelka','USA'],['Jordan Thompson','AUS'],['Thanasi Kokkinakis','AUS'],['Alejandro Davidovich Fokina','ESP'],['Roberto Bautista Agut','ESP'],['Marcos Giron','USA'],['Jiri Lehecka','CZE'],['Tomas Machac','CZE'],['Arthur Rinderknech','FRA'],['Quentin Halys','FRA']];
const sponsors={'Jannik Sinner':['Nike','HEAD','Rolex','Gucci','Lavazza','Allianz'],'Carlos Alcaraz':['Nike','Babolat'],'Alexander Zverev':['adidas','HEAD'],'Arthur Fils':['Lacoste','Babolat'],'Novak Djokovic':['Lacoste','HEAD']};
const attrNames=['Puissance service','Précision service','Coup droit','Revers','Retour','Volée','Toucher','Déplacements','Vitesse','Endurance','Force','Anticipation','Concentration','Sang-froid','Combativité','Tactique','Double','Terre battue','Dur','Gazon'];
function seeded(i,s=0){let x=Math.sin((i+1)*(12.9898+s*78.233))*43758.5453;return x-Math.floor(x)}
function makeAttrs(i,rank){const base=Math.max(7,19-Math.floor(Math.log2(Math.max(2,rank))));return attrNames.map((n,k)=>[n,Math.max(5,Math.min(20,Math.round(base+(seeded(i,k)-.5)*6)))])}
function buildPlayers(){let p=top20.map((x,i)=>({id:`r${i+1}`,name:x[0],country:x[1],rank:i+1,points:x[2],real:true}));let r=21;for(const x of extraReal){if(p.some(v=>v.name===x[0]))continue;p.push({id:`r${r}`,name:x[0],country:x[1],rank:r,points:Math.max(120,2180-r*22),real:true});r++}
const countries=['FRA','USA','ESP','ITA','GER','AUS','CZE','ARG','GBR','CAN','BRA','NED','BEL','SUI','AUT','JPN','KOR'];while(p.length<300){const i=p.length+1;p.push({id:`s${i}`,name:`Joueur simulé ${String(i).padStart(3,'0')}`,country:countries[i%countries.length],rank:i,points:Math.max(5,1450-i*4),real:false})}return p.map((x,i)=>({...x,doubleRank:Math.max(1,Math.round(x.rank*1.7+seeded(i,2)*120)),age:x.real?Math.round(19+seeded(i,4)*16):18+Math.floor(seeded(i,4)*15),height:175+Math.floor(seeded(i,5)*24),weight:68+Math.floor(seeded(i,6)*22),handed:seeded(i,7)>.14?'Droitier':'Gaucher',backhand:seeded(i,8)>.18?'2 mains':'1 main',ca:Math.max(45,95-Math.log2(x.rank+1)*7),potential:Math.min(98,Math.max(55,95-Math.log2(x.rank+1)*5+(x.age<23?5:0))),form:55+Math.floor(seeded(i,9)*40),fitness:70+Math.floor(seeded(i,10)*29),morale:55+Math.floor(seeded(i,11)*40),fatigue:5+Math.floor(seeded(i,12)*35),style:['Attaquant fond de court','Contreur','Serveur-volée','All-court','Défenseur'][Math.floor(seeded(i,13)*5)],attrs:makeAttrs(i,x.rank),scout:65+Math.floor(seeded(i,14)*35)}))}
const defaultState={date:'2026-09-27',week:1,managed:{id:'anthony',name:'Anthony',country:'FRA',rank:742,doubleRank:1284,points:34,age:19,height:184,weight:78,handed:'Droitier',backhand:'2 mains',ca:56,potential:82,form:72,fitness:91,morale:78,fatigue:18,budget:14800,style:'Attaquant polyvalent',attrs:attrNames.map((n,i)=>[n,10+(i%5)]),scout:100},training:['Service','Retour','Coup droit','Récupération','Déplacements','Match play','Repos'],news:['Anthony confirme son inscription au Challenger de Mouilleron-le-Captif.','Le staff recommande une semaine à charge modérée avant le prochain tournoi.','La fédération française publie une pré-sélection élargie pour la Coupe Davis.'],entries:[],finance:{prize:0,sponsors:0,travel:1450,staff:920},staff:[['Coach principal',14,650],['Préparateur physique',12,420],['Kinésithérapeute',13,380],['Agent',11,300]],facilities:[['Courts',2],['Salle de musculation',1],['Centre médical',1]],rankingHistory:[{date:'2026-09-27',rank:742,points:34}]};
function load(){try{return {...defaultState,...JSON.parse(localStorage.getItem('courtBossState')||'{}')}}catch{return structuredClone(defaultState)}}
let state=load(), players=buildPlayers(), route='home', profile=null, profileTab='overview';
let tournaments=[['Paris Masters','Paris','FRA','Dur','Masters 1000','2026-10-26',80,120],['Challenger Mouilleron','Mouilleron-le-Captif','FRA','Dur','Challenger 100','2026-10-05',145,240],['Challenger Brest','Brest','FRA','Dur','Challenger 100','2026-10-19',170,260],['ITF Rodez','Rodez','FRA','Dur','M25','2026-10-12',650,950],['ITF Monastir','Monastir','TUN','Dur','M25','2026-10-19',720,1100],['ATP 250 Metz','Metz','FRA','Dur','ATP 250','2026-11-02',56,95],['NCAA Fall Invitational','Austin','USA','Dur','NCAA','2026-10-09',null,null],['Davis Cup Final 8','Bologne','ITA','Dur','Davis Cup','2026-11-18',null,null]];
function save(){localStorage.setItem('courtBossState',JSON.stringify(state));cloudSave()}
async function cloudSave(){try{await fetch(API_BASE+'/api/save',{method:'POST',headers:{'Content-Type':'application/json','X-Save-Key':cloudSaveKey},body:JSON.stringify(state)})}catch(e){console.warn('Cloud save indisponible',e)}}
function attrsFromCloud(a){if(!a)return [];const k=['serve_power','serve_precision','forehand','backhand','return_game','volley','touch','movement','speed','stamina','strength','anticipation','concentration','composure','fighting_spirit','tactics','doubles','clay_affinity','hard_affinity','grass_affinity'];return attrNames.map((n,i)=>[n,a[k[i]]??10])}
async function cloudInit(){try{const r=await fetch(API_BASE+'/api/bootstrap',{headers:{'X-Save-Key':cloudSaveKey}});if(!r.ok)throw new Error('bootstrap '+r.status);const d=await r.json();if(Array.isArray(d.players)&&d.players.length){players=d.players.map(p=>({id:String(p.id),name:p.name,country:p.country,rank:p.ranking,points:p.points,doubleRank:p.doubles_ranking||9999,age:p.age||0,height:p.height_cm||0,weight:p.weight_kg||0,handed:p.handedness||'—',backhand:p.backhand||'—',ca:p.current_ability||50,potential:p.potential||50,form:p.form||70,fitness:p.fitness||90,morale:p.morale||75,fatigue:p.fatigue||15,style:p.style||'Non renseigné',attrs:attrsFromCloud(p.player_attributes),scout:p.scouting_confidence||70,real:!!p.is_real}))}if(d.save){state={...defaultState,...d.save};localStorage.setItem('courtBossState',JSON.stringify(state))}if(Array.isArray(d.tournaments)&&d.tournaments.length){tournaments=d.tournaments.map(t=>[t.name,t.city,t.country,t.surface,t.level,t.start_date,t.direct_cut,t.qual_cut])}if(Array.isArray(d.news)&&d.news.length&&!d.save){state.news=d.news.map(x=>x.body).slice(0,6)}render()}catch(e){console.warn('Mode local actif',e)}}
function fmt(n){return new Intl.NumberFormat('fr-FR').format(Math.round(n))}
function datefr(s){return new Date(s+'T12:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'})}
function shell(content){return `<div class="shell"><div class="topbar"><div class="brand">COURT <b>BOSS</b></div><div class="grow"></div><span class="date-pill">${datefr(state.date)}</span><button class="sim-btn" onclick="simulateWeek()">Simuler 1 semaine</button></div><main class="page">${content}</main>${nav()}</div>${profile?profileModal():''}`}
function nav(){const items=[['home','Accueil'],['calendar','Calendrier'],['rankings','Classements'],['players','Joueurs'],['management','Gestion'],['davis','Davis'],['more','Plus']];return `<nav class="nav">${items.map(x=>`<button class="${route===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</nav>`}
function go(r){route=r;render()}
function pCard(p){return `<div class="card click" onclick="openPlayer('${p.id}')"><div class="row between"><div><div class="kicker">${p.real?'Joueur réel':'Simulation'}</div><h3>${flags[p.country]||'🏳️'} ${p.name}</h3></div><strong>#${p.rank}</strong></div><div class="muted">${fmt(p.points)} pts · ${p.age} ans · ${p.style}</div></div>`}
function home(){const m=state.managed;return `<div class="section-title"><div><div class="kicker">Carrière active</div><h1>Tableau de bord</h1></div><span class="pill">Semaine ${state.week}</span></div><section class="hero"><div class="card"><div class="row between"><div><div class="kicker">Joueur géré</div><div class="hero-name">${flags[m.country]} ${m.name}</div><p class="muted">${m.age} ans · ${m.height} cm · ${m.handed} · ${m.style}</p></div><div class="rank">#${m.rank}</div></div><div class="grid g4"><div><span class="muted">Forme</span><div class="metric"><strong>${m.form}</strong><span>/100</span></div><div class="statbar"><i style="width:${m.form}%"></i></div></div><div><span class="muted">Fitness</span><div class="metric"><strong>${m.fitness}</strong><span>/100</span></div><div class="statbar"><i style="width:${m.fitness}%"></i></div></div><div><span class="muted">Moral</span><div class="metric"><strong>${m.morale}</strong><span>/100</span></div><div class="statbar"><i style="width:${m.morale}%"></i></div></div><div><span class="muted">Fatigue</span><div class="metric"><strong>${m.fatigue}</strong><span>/100</span></div><div class="statbar"><i style="width:${m.fatigue}%"></i></div></div></div></div><div class="card"><div class="kicker">Finances</div><div class="metric"><strong>${fmt(m.budget)} €</strong><span class="muted">solde</span></div><p class="muted">Dépenses hebdo estimées : ${fmt(state.finance.staff+state.finance.travel/4)} €</p><hr style="border-color:var(--line);border-width:1px 0 0"><div class="kicker" style="margin-top:12px">Prochain tournoi</div><h3>Challenger Mouilleron</h3><span class="badge surface-hard">Dur · Challenger 100</span><p class="muted">5 oct. 2026 · Cut direct #145 · Qualifs #240</p></div></section><section class="grid g2" style="margin-top:14px"><div class="card"><div class="section-title"><h3>Semaine d'entraînement</h3><button class="ghost" onclick="go('management')">Modifier</button></div><div class="grid g2">${state.training.map((x,i)=>`<div class="training-slot"><span>J${i+1}</span><b>${x}</b></div>`).join('')}</div></div><div class="card"><h3>Actualités</h3>${state.news.map(x=>`<div class="news">${x}</div>`).join('')}</div></section>`}
function rankings(){const list=players.slice().sort((a,b)=>a.rank-b.rank);return `<div class="section-title"><div><div class="kicker">Monde</div><h1>Classements</h1></div></div><div class="card"><div class="tabs"><button class="active">ATP Simple</button><button>ATP Double</button><button>Challenger</button><button>ITF WTT</button><button>NCAA / ITA</button></div><input class="search" id="rankSearch" placeholder="Rechercher un joueur…" oninput="renderRankingRows(this.value)"><div id="rankRows">${rankTable(list.slice(0,50))}</div></div>`}
function rankTable(list){return `<table class="table"><thead><tr><th>#</th><th>Joueur</th><th>Pts</th><th>Évolution</th></tr></thead><tbody>${list.map(p=>`<tr class="click" onclick="openPlayer('${p.id}')"><td><b>${p.rank}</b></td><td>${flags[p.country]||'🏳️'} ${p.name}</td><td>${fmt(p.points)}</td><td class="${seeded(p.rank,33)>.5?'good':'bad'}">${seeded(p.rank,33)>.5?'▲':'▼'} ${1+Math.floor(seeded(p.rank,34)*5)}</td></tr>`).join('')}</tbody></table>`}
window.renderRankingRows=q=>{const x=q.toLowerCase();$('#rankRows').innerHTML=rankTable(players.filter(p=>p.name.toLowerCase().includes(x)).slice(0,80))}
function playersPage(){return `<div class="section-title"><div><div class="kicker">Base mondiale</div><h1>Joueurs</h1></div><span class="pill">${players.length} profils</span></div><input class="search" placeholder="Nom, pays…" oninput="renderPlayerGrid(this.value)"><div id="playerGrid" class="grid g3" style="margin-top:14px">${players.slice(0,30).map(pCard).join('')}</div>`}
window.renderPlayerGrid=q=>{const x=q.toLowerCase();$('#playerGrid').innerHTML=players.filter(p=>(p.name+' '+p.country).toLowerCase().includes(x)).slice(0,60).map(pCard).join('')||'<div class="empty">Aucun joueur</div>'}
function calendar(){return `<div class="section-title"><div><div class="kicker">Saison 2026</div><h1>Calendrier</h1></div></div><div class="stack">${tournaments.map((t,i)=>{const joined=state.entries.includes(i);const elig=t[6]==null?'Éligibilité spéciale':state.managed.rank<=t[6]?'Tableau direct':state.managed.rank<=t[7]?'Qualifications':'Alternate';return `<div class="card"><div class="row between"><div><div class="kicker">${t[4]}</div><h3>${flags[t[2]]||'🏳️'} ${t[0]}</h3><div class="muted">${t[1]} · ${datefr(t[5])} · <span class="surface-${t[3]==='Dur'?'hard':t[3]==='Terre'?'clay':'grass'}">${t[3]}</span></div></div><div style="text-align:right"><span class="badge ${elig==='Tableau direct'?'good':elig==='Qualifications'?'warn':''}">${elig}</span><p><button class="${joined?'ghost danger':'primary'}" onclick="toggleEntry(${i})">${joined?'Se désinscrire':'S’inscrire'}</button></p></div></div></div>`}).join('')}</div>`}
function toggleEntry(i){state.entries=state.entries.includes(i)?state.entries.filter(x=>x!==i):[...state.entries,i];save();render()}
function management(){return `<div class="section-title"><div><div class="kicker">Performance & carrière</div><h1>Gestion</h1></div></div><div class="grid g2"><div class="card"><h3>Programme hebdomadaire</h3><div class="stack">${state.training.map((x,i)=>`<div class="training-slot"><span>Jour ${i+1}</span><select class="select" onchange="setTraining(${i},this.value)">${['Service','Retour','Coup droit','Revers','Déplacements','Endurance','Match play','Double','Récupération','Repos'].map(v=>`<option ${v===x?'selected':''}>${v}</option>`).join('')}</select></div>`).join('')}</div><p class="notice mini">Les séances chargées augmentent la progression mais aussi la fatigue et le risque de blessure. La simulation hebdomadaire applique ces effets.</p></div><div class="card"><h3>Staff</h3><table class="table"><thead><tr><th>Rôle</th><th>Niveau</th><th>Coût</th></tr></thead><tbody>${state.staff.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}/20</td><td>${fmt(x[2])} €</td></tr>`).join('')}</tbody></table></div><div class="card"><h3>Installations</h3>${state.facilities.map((x,i)=>`<div class="row between news"><div><b>${x[0]}</b><div class="muted">Niveau ${x[1]}/5</div></div><button class="ghost" onclick="upgrade(${i})">Améliorer · ${fmt(2500*x[1])} €</button></div>`).join('')}</div><div class="card"><h3>Finances</h3><div class="grid g2"><div><span class="muted">Solde</span><strong style="display:block;font-size:25px">${fmt(state.managed.budget)} €</strong></div><div><span class="muted">Prize money</span><strong style="display:block;font-size:25px">${fmt(state.finance.prize)} €</strong></div><div><span class="muted">Staff / semaine</span><b>${fmt(state.finance.staff)} €</b></div><div><span class="muted">Voyages</span><b>${fmt(state.finance.travel)} €</b></div></div></div></div>`}
function setTraining(i,v){state.training[i]=v;save()}
function upgrade(i){const cost=2500*state.facilities[i][1];if(state.managed.budget<cost)return alert('Budget insuffisant');if(state.facilities[i][1]>=5)return alert('Installation au maximum');state.managed.budget-=cost;state.facilities[i][1]++;save();render()}
function davis(){const fr=players.filter(p=>p.country==='FRA').slice(0,14);return `<div class="section-title"><div><div class="kicker">Fédération française</div><h1>Coupe Davis</h1></div><span class="pill">Réputation 88/100</span></div><div class="grid g2"><div class="card"><h3>Groupe France</h3>${fr.map(p=>`<div class="row between news click" onclick="openPlayer('${p.id}')"><span>${flags.FRA} ${p.name}</span><b>#${p.rank}</b></div>`).join('')}</div><div class="card"><div class="kicker">Prochaine rencontre</div><h2>France vs Italie</h2><p class="muted">Final 8 · Bologne · Dur indoor</p><div class="stack"><div class="training-slot"><span>Simple 1</span><b>Arthur Fils</b></div><div class="training-slot"><span>Simple 2</span><b>Ugo Humbert</b></div><div class="training-slot"><span>Double</span><b>Doumbia / Reboul</b></div></div><p class="notice mini">Format Final 8 : deux simples puis un double décisif si nécessaire.</p></div></div>`}
function more(){return `<div class="section-title"><div><div class="kicker">Autres compétitions</div><h1>Double & Universitaire</h1></div></div><div class="grid g2"><div class="card"><h3>Double</h3><p class="muted">Partenaire actuel : aucun partenaire permanent.</p>${players.filter(p=>['Pierre-Hugues Herbert','Nicolas Mahut','Sadio Doumbia','Fabien Reboul'].includes(p.name)).map(p=>`<div class="row between news click" onclick="openPlayer('${p.id}')"><span>${p.name}</span><span class="badge">Double #${p.doubleRank}</span></div>`).join('')}<p class="notice mini">La compatibilité combine niveau de double, styles, forme et fatigue.</p></div><div class="card"><h3>Université · NCAA / ITA</h3><div class="timeline"><div class="event"><b>Texas Longhorns</b><div class="muted">ITA #1 · bilan 14-2</div></div><div class="event"><b>Virginia Cavaliers</b><div class="muted">ITA #2 · bilan 13-3</div></div><div class="event"><b>TCU Horned Frogs</b><div class="muted">ITA #3 · bilan 12-3</div></div></div><p class="muted">Voie alternative : bourse universitaire, doubles NCAA, team duals, puis passage pro.</p></div></div>`}
function openPlayer(id){profile=players.find(p=>p.id===id)||state.managed;profileTab='overview';render()}
function profileModal(){const p=profile;const tabs=[['overview','Vue d’ensemble'],['attributes','Attributs'],['career','Carrière'],['commercial','Commercial'],['history','Historique']];return `<div class="modal" onclick="if(event.target===this){profile=null;render()}"><div class="modal-box"><div class="modal-head"><div><div class="kicker">${p.real?'Profil joueur réel · données de jeu séparées':'Profil de simulation'}</div><h1 style="margin:3px 0">${flags[p.country]||'🏳️'} ${p.name}</h1><div class="muted">#${p.rank} · ${fmt(p.points||0)} pts · ${p.age} ans · ${p.height} cm</div></div><button class="close" onclick="profile=null;render()">✕</button></div><div class="subnav" style="margin:16px 0">${tabs.map(t=>`<button class="${profileTab===t[0]?'active':''}" onclick="profileTab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>${profileBody(p)}</div></div>`}
function profileBody(p){if(profileTab==='attributes')return `<div class="notice">Les notes 1–20 ci-dessous sont des évaluations de scouting pour le jeu. Elles ne constituent pas des statistiques officielles ATP.</div><div class="attr-grid" style="margin-top:12px">${p.attrs.map(a=>`<div class="attr"><span>${a[0]}</span><b class="${a[1]>=16?'good':a[1]<=8?'bad':''}">${a[1]}</b><div class="statbar"><i style="width:${a[1]*5}%"></i></div></div>`).join('')}</div><p class="muted">Confiance scouting : ${p.scout}%</p>`;if(profileTab==='career'){const titles=p.rank<=10?4:p.rank<=30?2:p.rank<=100?1:0;return `<div class="grid g3"><div class="card"><div class="kicker">Titres 2026</div><strong style="font-size:30px">${titles}</strong></div><div class="card"><div class="kicker">Bilan saison</div><strong style="font-size:30px">${Math.max(3,38-Math.floor(p.rank/20))}-${Math.max(2,8+Math.floor(p.rank/30))}</strong></div><div class="card"><div class="kicker">Meilleur classement</div><strong style="font-size:30px">#${Math.max(1,p.rank-Math.floor(seeded(p.rank,90)*15))}</strong></div></div><div class="card" style="margin-top:12px"><h3>Palmarès récent</h3>${titles?Array.from({length:titles},(_,i)=>`<div class="news"><b>${['ATP 500 Rotterdam','Masters 1000 Rome','ATP 250 Marseille','Challenger Bordeaux'][i%4]}</b><div class="muted">2026 · ${i%2?'Terre battue':'Dur'} · ${i%2?'Masters/ATP':'ATP/Challenger'}</div></div>`).join(''):'<div class="empty">Aucun titre enregistré cette saison.</div>'}</div>`}if(profileTab==='commercial'){const sp=sponsors[p.name];return `<div class="card"><h3>Partenaires commerciaux</h3>${sp?sp.map(s=>`<span class="badge" style="margin:4px">${s}</span>`).join(''):'<div class="empty">Non vérifié</div>'}<p class="muted mini">Seuls les sponsors explicitement vérifiés sont affichés. Les autres profils restent volontairement non renseignés.</p></div>`}if(profileTab==='history'){const base=p.rank;return `<div class="card"><h3>Historique de classement</h3>${Array.from({length:8},(_,i)=>`<div class="row between news"><span>S-${7-i}</span><b>#${Math.max(1,base+Math.round((seeded(base,i+140)-.5)*18))}</b></div>`).join('')}</div>`}return `<div class="grid g2"><div class="card"><h3>Profil</h3><div class="grid g2"><div><span class="muted">Main</span><b style="display:block">${p.handed}</b></div><div><span class="muted">Revers</span><b style="display:block">${p.backhand}</b></div><div><span class="muted">Style</span><b style="display:block">${p.style}</b></div><div><span class="muted">Double</span><b style="display:block">#${p.doubleRank}</b></div></div></div><div class="card"><h3>Niveau & potentiel</h3><div class="metric"><span>Capacité actuelle</span><strong>${Math.round(p.ca)}</strong></div><div class="statbar"><i style="width:${p.ca}%"></i></div><br><div class="metric"><span>Potentiel</span><strong>${Math.round(p.potential)}</strong></div><div class="statbar"><i style="width:${p.potential}%"></i></div></div><div class="card"><h3>Condition</h3>${[['Forme',p.form],['Fitness',p.fitness],['Moral',p.morale],['Fatigue',p.fatigue]].map(x=>`<div style="margin:10px 0"><div class="row between"><span>${x[0]}</span><b>${x[1]}</b></div><div class="statbar"><i style="width:${x[1]}%"></i></div></div>`).join('')}</div><div class="card"><h3>Derniers résultats</h3>${Array.from({length:4},(_,i)=>`<div class="news"><b class="${i===3?'bad':'good'}">${i===3?'D':'V'}</b> vs ${players[(p.rank+i*13)%players.length].name}<div class="muted mini">${['6-4 6-3','7-6 3-6 6-2','6-2 6-4','4-6 6-7'][i]} · Dur</div></div>`).join('')}</div></div>`}
function simulateWeek(){const m=state.managed;const load=state.training.reduce((a,x)=>a+(['Endurance','Match play','Déplacements','Service','Retour','Coup droit','Revers'].includes(x)?2:x==='Récupération'||x==='Repos'?-1:1),0);m.fatigue=Math.max(0,Math.min(100,m.fatigue+load-Math.round(seeded(state.week,2)*8)));m.fitness=Math.max(40,Math.min(100,m.fitness+(load<=8?2:-2)));m.form=Math.max(30,Math.min(100,m.form+Math.round((seeded(state.week,3)-.42)*8)));m.morale=Math.max(30,Math.min(100,m.morale+Math.round((seeded(state.week,4)-.45)*6)));if(load>10&&seeded(state.week,5)>.78){m.fitness-=8;state.news.unshift('Alerte médicale : petite gêne musculaire après une semaine trop chargée.')}const improve=seeded(state.week,6)>.45;if(improve&&m.rank>80){m.rank=Math.max(1,m.rank-(1+Math.floor(seeded(state.week,7)*12)));m.points+=4+Math.floor(seeded(state.week,8)*15);state.finance.prize+=350+Math.floor(seeded(state.week,9)*1200);m.budget+=state.finance.prize?Math.floor(200+seeded(state.week,10)*800):0}else{m.rank+=Math.floor(seeded(state.week,11)*5)}m.budget-=state.finance.staff;for(const p of players){const swing=Math.round((seeded(p.rank,state.week)-.5)*3);p.rank=Math.max(1,p.rank+swing);p.form=Math.max(35,Math.min(99,p.form+Math.round((seeded(p.rank,state.week+30)-.5)*8)))}const d=new Date(state.date+'T12:00:00');d.setDate(d.getDate()+7);state.date=d.toISOString().slice(0,10);state.week++;state.rankingHistory.push({date:state.date,rank:m.rank,points:m.points});state.news.unshift(`Semaine ${state.week-1} simulée : Anthony est désormais classé #${m.rank}.`);state.news=state.news.slice(0,6);save();render()}
function render(){let content=route==='home'?home():route==='calendar'?calendar():route==='rankings'?rankings():route==='players'?playersPage():route==='management'?management():route==='davis'?davis():more();app.innerHTML=shell(content)}
render();
cloudInit();

</script>
</body>
</html>
