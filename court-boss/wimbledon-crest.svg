<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="title desc">
  <title id="title">Wimbledon</title>
  <desc id="desc">Écusson circulaire violet et vert avec deux raquettes croisées</desc>
  <defs>
    <path id="topArc" d="M 25,101 A 75,75 0 0 1 175,101"/>
    <path id="bottomArc" d="M 29,109 A 75,75 0 0 0 171,109"/>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#008a4f"/><stop offset="100%" stop-color="#00623b"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#07160d" flood-opacity=".25"/></filter>
    <g id="racket">
      <ellipse cx="0" cy="-31" rx="13" ry="21" fill="none" stroke="#fff" stroke-width="3.4"/>
      <path d="M -10,-43 L 10,-43 M -11,-35 L 11,-35 M -12,-26 L 12,-26 M -9,-17 L 9,-17 M -7,-49 L -7,-12 M 0,-52 L 0,-10 M 7,-49 L 7,-12" fill="none" stroke="#fff" stroke-width="1.05" opacity=".86"/>
      <path d="M 0,-10 L 0,34" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <path d="M 0,22 L 0,35" stroke="#c6e4d5" stroke-width="1.4" stroke-linecap="round"/>
    </g>
  </defs>
  <circle cx="100" cy="100" r="97" fill="#43207c" stroke="#fff" stroke-width="3"/>
  <circle cx="100" cy="100" r="81" fill="none" stroke="#fff" stroke-width="2"/>
  <circle cx="100" cy="100" r="62" fill="url(#field)" stroke="#fff" stroke-width="3.5"/>
  <g font-family="Arial,Helvetica,sans-serif" font-weight="800" fill="#fff" text-anchor="middle">
    <text font-size="14.4" letter-spacing="2.3"><textPath href="#topArc" xlink:href="#topArc" startOffset="50%">THE CHAMPIONSHIPS</textPath></text>
    <text font-size="17" letter-spacing="3.2"><textPath href="#bottomArc" xlink:href="#bottomArc" startOffset="50%">WIMBLEDON</textPath></text>
  </g>
  <g transform="translate(100 108)" filter="url(#shadow)">
    <g transform="rotate(-38)"><use href="#racket" xlink:href="#racket"/></g>
    <g transform="rotate(38)"><use href="#racket" xlink:href="#racket"/></g>
    <circle cx="0" cy="-10" r="5" fill="#fff" stroke="#00623b" stroke-width="1.5"/>
  </g>
</svg>